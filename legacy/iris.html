function searchMarkup(){const words=normalizeSearch(query).split(/\s+/).filter(Boolean),matches=words.length?searchEntries().filter(e=>words.every(w=>normalizeSearch(e.title+' '+e.subtitle+' '+(e.amount??'')+' '+(e.amount!==undefined?money(e.amount):'')).includes(w))):[],items=matches.filter(e=>searchFilter==='all'||e.kind===searchFilter);const labels={all:'Todo',tasks:'Tareas',expenses:'Gastos',incomes:'Ingresos',notes:'Notas',events:'Eventos',services:'Servicios',accounts:'Cuentas',transfers:'Transferencias',cards:'Tarjetas',cardPurchases:'Compras con tarjeta',cardPayments:'Pagos de tarjeta'};return `<h1>Buscar en Centro</h1><p>Una búsqueda para tus aplicaciones.</p><div class="filter-bar" aria-label="Filtrar búsqueda">${Object.entries(labels).map(([key,label])=>`<button class="${searchFilter===key?'selected':''}" aria-pressed="${searchFilter===key}" onclick="filterSearch('${key}')">${label}${query?' · '+(key==='all'?matches.length:matches.filter(e=>e.kind===key).length):''}</button>`).join('')}</div>${!query?`<section class="card"><span class="tile">${icon('search')}</span><h2 style="margin:14px 0 6px">¿Qué querés encontrar?</h2><p>Buscá por nombre, importe, categoría, medio de ingreso o contenido de tus notas.</p></section>`:`<p class="small" role="status" style="margin-bottom:12px">${items.length} ${items.length===1?'resultado':'resultados'} para “${esc(query)}”</p><section class="card search-results">${items.length?items.map(e=>`<button class="search-result" onclick="openSearchResult('${e.kind}','${e.id}')"><span class="tile">${icon(e.icon)}</span><span class="result-copy"><strong>${esc(e.title)}</strong><span class="small">${esc(e.subtitle.slice(0,180))}${e.subtitle.length>180?'…':''}</span></span>${e.amount!==undefined?`<span class="amount">${cash(e.amount,e.currency||'ARS')}</span>`:''}${icon('right')}</button>`).join(''):`<div class="empty"><h3>No encontramos coincidencias</h3><p>Probá con otra palabra o cambiá el filtro.</p><button class="textbtn" onclick function activityMarkup(){const labels={all:'Todo',Centro:'Centro',Iris:'Iris','Mi espacio':'Mi espacio',Organizador:'Organizador',Journal:'Journal'},items=state.activity.filter(e=>activityFilter==='all'||e.apps.includes(activityFilter));return `<h1>Actividad</h1><p>Tu historial de cambios: qué hiciste, cuándo y qué aplicaciones se actualizaron.</p><p class="small" style="margin-top:8px">Se completa automáticamente. Por ejemplo, registrar electricidad deja una sola acción que conecta el gasto, el servicio y la tarea.</p><div class="filter-bar" aria-label="Filtrar actividad">${Object.entries(labels).map(([key,label])=>`<button class="${activityFilter===key?'selected':''}" aria-pressed="${activityFilter===key}" onclick="activityFilter='${key}';render()">${label}</button>`).join('')}</div><section class="card">${items.length?items.map(e=>`<div class="activity-row"><span class="tile">${icon(e.icon)}</span><div class="grow"><h3>${esc(e.title)}</h3><p>${esc(e.detail)}</p><div class="small">${e.apps.map(esc).join(' · ')}<span aria-hidden="true"> · </span><time datetime="${e.at}">${new Date(e.at).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</time></div></div></div>`).join(''):`<div class="empty"><span class="tile">${icon('layers')}</span><h3 style="margin:14px 0 6px">Todavía no hay actividad${activityFilter==='all'?'':' en '+esc(activityFilter)}</h3><p>No tenés que cargar nada acá. Los cambios que hagas en tus aplicaciones aparecerán automáticamente.</p></div>`}</section>`}
function captureActivity(){const entries=[],now=new Date().toISOString(),add=(title,detail,apps,icon)=>entries.push({id:crypto.randomUUID(),at:now,title,detail,apps,icon});if(state.paid!==lastSnapshot.paid)add(state.paid?'Pago de electricidad registrado':'Pago de electricidad deshecho',state.paid?'Un solo registro actualizó el servicio, el gasto y la tarea.':'Se reabrió la tarea y se retiró el gasto del saldo.',['Mi espacio','Iris','Organizador'],'zap');const configs=[['tasks','Tarea','Organizador','check'],['expenses','Gasto','Iris','wallet'],['incomes','Ingreso','Iris','plus'],['notes','Nota','Journal','note'],['events','Evento','Organizador','calendar'],['accounts','Cuenta','Iris','wallet'],['transfers','Transferencia','Iris','right'],['cards','Tarjeta','Iris','credit'],['cardPurchases','Compra con tarjeta','Iris','credit'],['cardPayments','Pago de tarjeta','Iris','credit']];for(const [collection,label,app,ic] of configs){const before=new Map(lastSnapshot[collection].map(e=>[e.id,e])),after=new Map(state[collection].map(e=>[e.id,e]));for(const [id,item]of after){if(id==='electricity')continue;let old=before.get(id),detail=item.title||item.text||item.name||item.note||'';if(!old)add(label+' '+activityCreationVerb(label,collection,id),detail,[app],ic);else if(JSON.stringify(old)!==JSON.stringify(item)){let action=label==='Tarea'||label==='Evento'?(old.done!==item.done?(item.done?'completado':'reabierto'):'actualizado'):'actualizado';if(label==='Tarea')action=action.replace('completado','completada').replace('reabierto','reabierta').replace('actualizado','actualizada');if(['Nota','Cuenta','Transferencia','Tarjeta','Compra con tarjeta'].includes(label))action='actualizada';add(label+' '+action,detail,[app],ic)}}for(const [id,item]of before){if(id!=='electricity'&&!after.has(id))add(label+' '+(['Tarea','Nota','Cuenta','Transferencia','Tarjeta','Compra con tarjeta'].includes(label)?'eliminada':'eliminado'),item.title||item.text||item.name||item.note||'',[app],ic)}}if(JS let irisTab='summary',irisCurrency='ARS',irisMonth='',irisType='all',irisAccount='all',irisQuery='';

entas',"goIris('accounts')",'Ver cuentas')}${state.accounts.filter(a=>a.currency===irisCurrency).map(a=>`<button class="account-short" onclick="irisAccount='${a.id}';irisTab='moves';render()"><span class="tile">${icon(a.type==='efectivo'?'coins':a.type==='banco'?'bank':'wallet')}</span><span>${esc(a.name)}${a.archived?' · Archivada':''}</span><strong>${cash(accountBalance(a.id),a.currency)}</strong></button>`).join('')}<button class="textbtn" onclick="transferForm()">${icon('transfer')}Transferir entre cuentas</button></section><section class="card">${cardTitle('Últimos movimientos',"goIris('moves')",'Ver todos')}${financeRows(filteredIris().slice(0,5))}</section></div>`:irisTab==='accounts'?accountsMarkup():irisTab==='cards'?cardsMarkup():irisTab==='analysis'?analysisMarkup():`<section class="card"><div class="sectiontitle"><h2>Movimientos</h2><button onclick="transferForm()">${icon('right')}Transferencia</button></div><div class="finance-filters"><label>Tipo<select aria-label="Tipo de movimiento" onchange="irisType=this.value;render()">${[['all','Todos'],['incomes','Ingresos'],['expenses','Gastos'],['transfers','Transferencias']].map(([v,l])=>`<option value="${v}" ${v===irisType?'selected':''}>${l}</option>`).join('')}</select></label><label>Cuenta<select aria-label="Filtrar por cuenta" onchange="irisAccount=this.value;render()"><option value="all">Todas</option>${state.accounts.map(a=>`<option value="${a.id}" ${a.id===irisAccount?'selected':''}>${esc(a.name)} · ${a.currency}</option>`).join('')}</select></label></div>${financeRows(filteredIris())}</section>`}`}

function dateAtMonth(month,day){const [y,m]=month.split('-').map(Number);return y+'-'+String(m).padStart(2,'0')+'-'+String(Math.min(day,new Date(y,m,0).getDate())).padStart(2,'0')}
function shiftMonth(month,n){const [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function firstCardMonth(card,date){const month=date.slice(0,7),close=dateAtMonth(month,card.closeDay);const cycleMonth=date>close?shiftMonth(month,1):month;return card.dueDay>card.closeDay?cycleMonth:shiftMonth(cycleMonth,1)}
function cardSchedule(p){const total=cents(p.amount),base=Math.floor(total/p.installments),extra=total%p.installments;return Array.from({length:p.installments},(_,i)=>({purchaseId:p.id,text:p.text,number:i+1,count:p.installments,date:dateAtMonth(shiftMonth(p.firstMonth,i),p.dueDay),amount:(base+(i<extra?1:0))/100}))}
function cardDebt(id){return (state.cardPurchases.filter(p=>p.cardId===id).reduce((a,p)=>a+cents(p.amount),0)-state.cardPayments.filter(p=>p.cardId===id).reduce((a,p)=>a+cents(p.amount),0))/100}
function cardCycleTotal(card,today=localDay()){let month=today.slice(0,7),end=dateAtMonth(month,card.closeDay);if(today>end){month=shiftMonth(month,1);end=dateAtMonth(month,card.closeDay)}const start=dateAtMonth(shiftMonth(month,-1),card.closeDay);return state.cardPurchases.filter(p=>p.cardId===card.id&&p.date>start&&p.date<=end).reduce((a,p)=>a+cents(p.amount),0)/100}

function storeCard(d,id){const old=getCard(id),name=String(d.name||'').trim(),limit=Number(d.limit),closeDay=Number(d.closeDay),dueDay=Number(d.dueDay),locked=old&&state.cardPurchases.some(p=>p.cardId===id),currency=locked?old.currency:d.currency;if(!name||!['ARS','USD','EUR'].includes(currency)||!Number.isFinite(limit)||limit<=0||limit>999999999||![closeDay,dueDay].every(n=>Number.isInteger(n)&&n>=1&&n<=31))throw Error('Revisá el nombre, el límite y los días (del 1 al 31).');if(old&&cents(limit)<cents(cardDebt(id)))throw Error('El límite no puede ser menor que el saldo pendiente.');const value={name,currency,limit:cents(limit)/100,closeDay,dueDay};if(old)Object.assign(old,value);else state.cards.push({id:crypto.randomUUID(),archived:false,...value});return old||state.cards.at(-1)}

const baseIrisMarkup=irisMarkup;
irisMarkup=function(){const extra={services:irisServicesMarkup,debts:irisDebtsMarkup,savings:irisSavingsMarkup};if(extra[irisTab])return '<div class="heading"><div><h1>'+IRIS_NAV.find(v=>v[0]===irisTab)[1]+'</h1><p>'+({services:'Vencimientos y pagos, un período a la vez.',debts:'Lo que debés y lo que te deben.',savings:'Separá dinero para lo que querés construir.'}[irisTab])+'</p></div></div>'+extra[irisTab]();let html=baseIrisMarkup().replace(/<button class="textbtn" onclick="go\('home'\)">[\s\S]*?<\/button>/,'').replace(/<div class="iris-tabs"[\s\S]*?<\/div>/,'');if(irisTab==='summary')html+=`<div class="finance-kpis" style="margin-top:20px"><section class="card"><p>Reservado · ${irisCurrency}</p><div class="value">${cash(reservedCurrency(irisCurrency),irisCurrency)}</div></section><section class="card"><p>Sin reservar · ${irisCurrency}</p><div class="value">${cash(currencyBalance(irisCurrency)-reservedCurrency(irisCurrency),irisCurrency)}</div><p class="small">Las reservas siguen dentro de tus cuentas.</p></section><section class="card"><p>Pendiente en tarjetas · ${irisCurrency}</p><div class="value">${cash(state.cards.filter(c=>c.currency===irisCurrency).reduce((s,c)=>s+cents(cardDebt(c.id)),0)/100,irisCurrency)}</div></section></div>`;if(irisTab==='analysis')html+='<button style="margin-top:16px" onclick="categorySettings()">Personalizar categorías</button>';return html};
go=function(v){if(v==='settings'){settings();return}query='';document.getElementById('search').value='';view='expenses';if(IRIS_NAV.some(n=>n[0]===v))irisTab=v;render();window.scrollTo(0,0)};
render=function(){document.body.classList.toggle('dark',state.theme==='dark');document.body.classList.toggle('compact',state.compact);const nav=IRIS_NAV.map(([key,label,ic])=>`<button class="${irisTab===key&&!query?'active':''}" onclick="go('${key}')">${icon(ic)}${label}</button>`).join('');document.getElementById('nav').innerHTML=nav;document.getElementById('mobileIris').innerHTML=IRIS_NAV.slice(0,3).map(([key,label,ic])=>`<button class="${irisTab===key&&!query?'active':''}" onclick="go('${key}')">${icon(ic)}${label}</button>`).join('')+`<button onclick="irisMore()" class="${IRIS_NAV.slice(3).some(n=>n[0]===irisTab)?'active':''}">${icon('more')}Más</button>`;document.getElementById('content').innerHTML=query?searchMarkup().replace('Buscar en Centro','Buscar en Iris').replace('Una búsqueda para tus aplicaciones.','Encontrá movimientos, cuentas y tarjetas.'):irisMarkup();document.getElementById('clearSearchButton').hidden=!query;document.getElementById('saveNotice').hidden=!persistenceProblem;icons()};
function irisMore(){modal('Secciones de Iris','<div class="form">'+IRIS_NAV.map(([key,label,ic])=>`<button style="justify-content:flex-start" onclick="closeModal();go('${key}')">${icon(ic)}${label}</button>`).join('')+'</div>')}
function irisExport(){const blob=new Blob([JSON.stringify({format:'iris03',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='iris-copia-'+localDay()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
settings=function(){modal('Ajustes de Iris',`<div class="form"><h3>Apariencia</h3><div class="finance-actions"><button onclick="state.theme='light';save();settings()">${icon('sun')}Claro</button><button onclick="state.theme='dark';save();settings()">${icon('moon')}Oscuro</button></div><h3>Densidad</h3><div class="iris-density">${[['Cómoda',false],['Compacta',true]].map(([label,compact])=>`<button class="${state.compact===compact?'selected':''}" onclick="state.compact=${compact};save();settings()"><span class="density-lines ${compact?'tight':''}"><i></i><i></i><i></i></span>${label}</button>`).join('')}</div><button onclick="categorySettings()">Personalizar categorías</button><div><h3>Tus datos</h3><p class="small" style="margin:8px 0 16px">Se guardan en este navegador. Exportá una copia para conservarlos o pasarlos a otro dispositivo.</p><button onclick="irisExport()">${icon('download')}Exportar copia</button></div><label>Restaurar una copia de Iris<input type="file" accept=".json,application/json" onchange="irisImport(this.files[0])"></label><button onclick="closeModal()">Cerrar</button></div>`)};
function categorySettings(){modal('Categorías de Iris',`<form id="categoryForm" class="form"><p class="small">Una categoría por línea, en el orden que querés verla. Los movimientos anteriores conservan su categoría.</p><label>Ingresos<textarea name="income" rows="6">${esc(state.incomeCategories.join('\n'))}</textarea></label><label>Gastos<textarea name="expense" rows="8">${esc(state.expenseCategories.join('\n'))}</textarea></label><button class="primary">Guardar categorías</button><button type="button" onclick="closeModal()">Cancelar</button></form>`);document.getElementById('categoryForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),parse=k=>[...new Set(String(d.get(k)).split('\n').map(s=>s.trim()).filter(Boolean))];const i=parse('income'),x=parse('expense');if(!i.length||!x.length||i.length>80||x.length>80||[...i,...x].some(c=>c.length>60)){notify('Agregá entre 1 y 80 categorías de hasta 60 caracteres.');return}state.incomeCategories=i;state.expenseCategories=x;closeModal();save();notify('Categorías guardadas')}}
let serviceMonth=localDay().slice(0,7);
function irisServicesMarkup(){return `<div class="finance-period"><label>Período<input type="month" value="${serviceMonth}" onchange="serviceMonth=this.value||localDay().slice(0,7);render()"></label><button class="primary" onclick="irisServiceForm()">${icon('plus')}Nuevo servicio</button></div><div class="credit-grid">${state.services.map(s=>{const p=state.servicePayments.find(p=>p.serviceId===s.id&&p.period===serviceMonth);return `<article class="card"><div class="sectiontitle"><h2>${esc(s.name)}</h2><span class="tag">${p?'Pagado':'Pendiente'}</span></div><div class="value">${cash(s.amount,s.currency)}</div><p class="small">Vence el ${s.day} · ${esc(s.provider||'Sin proveedor')}</p><div class="finance-actions" style="margin-top:18px"><button onclick="${p?`irisServiceReceipt('${p.id}')`:`irisServicePayForm('${s.id}')`}">${p?'Ver pago':'Registrar pago'}</button><button onclick="irisServiceForm('${s.id}')">Editar</button></div></article>`}).join('')||'<section class="card"><div class="empty"><h3>Tus servicios, un mes a la vez</h3><p>Agregá el proveedor, el importe y el día de vencimiento.</p><button onclick="irisServiceForm()">Agregar servicio</button></div></section>'}</div>`}
function irisServiceForm(id){const s=state.services.find(s=>s.id===id)||{name:'',provider:'',currency:'ARS',amount:'',day:10};modal(id?'Editar servicio':'Nuevo servicio',`<form id="irisServiceForm" class="form"><label>Nombre<input name="name" required maxlength="100" value="${esc(s.name)}"></label><label>Proveedor<input name="provider" maxlength="100" value="${esc(s.provider)}"></label><label>Importe mensual<input name="amount" type="number" min="0.01" step="0.01" required value="${s.amount}"></label><div class="form-pair"><label>Moneda<select name="currency">${['ARS','USD','EUR'].map(c=>`<option ${c===s.currency?'selected':''}>${c}</option>`).join('')}</select></label><label>Día de vencimiento<input name="day" type="number" min="1" max="31" required value="${s.day}"></label></div><button class="primary">Guardar servicio</button><button type="button" onclick="closeModal()">Cancelar</button></form>`);document.getElementById('irisServiceForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),v={name:d.get('name').trim(),provider:d.get('provider').trim(),currency:d.get('currency'),amount:Number(d.get('amount')),day:Number(d.get('day'))};if(!v.name||!Number.isFinite(v.amount)||v.amount<=0||!Number.isInteger(v.day)||v.day<1||v.day>31)return;if(id)Object.assign(s,v);else state.services.push({id:crypto.randomUUID(),...v});closeModal();save();notify('Servicio guardado')}}
function irisServicePayForm(id){const s=state.services.find(s=>s.id===id);if(!s)return;modal('Registrar pago de '+s.name,`<form class="form" id="servicePayForm"><label>Período<input type="month" name="period" required value="${serviceMonth}"></label><label>Importe<input type="number" name="amount" step="0.01" min="0.01" required value="${s.amount}"></label><label>Fecha<input name="date" type="date" required value="${localDay()}"></label><label>Pagar desde<select name="source" required><optgroup label="Cuentas">${state.accounts.filter(a=>!a.archived&&a.currency===s.currency).map(a=>`<option value="account:${a.id}">${esc(a.name)} · ${a.currency}</option>`).join('')}</optgroup><optgroup label="Tarjetas de crédito">${state.cards.filter(c=>!c.archived&&c.currency===s.currency).map(c=>`<option value="card:${c.id}">${esc(c.name)} · ${c.currency}</option>`).join('')}</optgroup></select></label><label>Medio<select name="method">${['Transferencia','Efectivo','Débito automático','Tarjeta de débito'].map(m=>'<option>'+m+'</option>').join('')}</select></label><p class="small">Desde una cuenta se registra un gasto. Con crédito se registra el consumo y su pago se hace desde Tarjetas.</p><button class="primary">Registrar pago</button><button type="button" onclick="closeModal()">Cancelar</button></form>`);document.getElementById('servicePayForm').onsubmit=e=>{e.preventDefault();try{storeIrisServicePayment(id,Object.fromEntries(new FormData(e.target)));closeModal();save();notify('Pago del servicio registrado')}catch(err){notify(err.message)}}}
function storeIrisServicePayment(id,d){const s=state.services.find(s=>s.id===id),amount=Number(d.amount);if(!s||state.servicePayments.some(p=>p.serviceId===id&&p.period===d.period))throw Error('El período ya está registrado.');if(!/^\d{4}-\d{2}$/.test(d.period)||!validCardDate(d.period+'-01')||!validCardDate(d.date)||!Number.isFinite(amount)||amount<=0)throw Error('Revisá los datos del pago.');const [kind,sourceId]=String(d.source).split(':');let movementId;if(kind==='card'){const c=getCard(sourceId);if(c?.currency!==s.currency)throw Error('La moneda no coincide.');const p=storeCardPurchase({cardId:sourceId,text:s.name+' · '+d.period,amount,date:d.date,installments:1,firstMonth:firstCardMonth(c,d.date),category:'Servicios'});movementId=p.id;p.sourceService=id}else{const a=getAccount(sourceId);if(!a||a.archived||a.currency!==s.currency)throw Error('Elegí una cuenta activa de la misma moneda.');if(cents(accountBalance(a.id))<cents(amount))throw Error('El saldo de la cuenta no alcanza.');const p={id:crypto.randomUUID(),text:s.name+' · '+d.period,amount:cents(amount)/100,date:d.date,accountId:a.id,currency:a.currency,method:d.method,category:'Servicios',sourceService:id};state.expenses.push(p);movementId=p.id}const p={id:crypto.randomUUID(),name:s.name,serviceId:id,period:d.period,amount:cents(amount)/100,currency:s.currency,date:d.date,kind,movementId};state.servicePayments.push(p);return p}
function irisServiceReceipt(id){const p=state.servicePayments.find(p=>p.id===id);if(!p)return;modal('Pago registrado',`<div class="form"><h3>${esc(p.name)}</h3><div class="value">${cash(p.amount,p.currency)}</div><p>${p.period} · ${p.date}</p><p class="small">${p.kind==='card'?'Consumo registrado en la tarjeta de crédito.':'Gasto registrado en la cuenta.'}</p><button class="danger" onclick="undoIrisServicePayment('${id}')">Deshacer registro del servicio</button><button onclick="closeModal()">Cerrar</button></div>`)}
function undoIrisServicePayment(id){const p=state.servicePayments.find(p=>p.id===id);if(!p)return;if(p.kind==='card'){const purchase=state.cardPurchases.find(c=>c.id===p.movementId);if(purchase&&cents(cardDebt(purchase.cardId))<cents(purchase.amount)){notify('Deshacé primero los pagos de la tarjeta que impiden retirar este consumo.');return}state.cardPurchases=state.cardPurchases.filter(c=>c.id!==p.movementId)}else state.expenses=state.expenses.filter(e=>e.id!==p.movementId);state.servicePayments=state.servicePayments.filter(e=>e.id!==id);closeModal();save();notify('Registro del servicio deshecho')}
function loanRemaining(id){const l=state.loans.find(l=>l.id===id);return l?(cents(l.amount)-state.loanEntries.filter(e=>e.loanId===id).reduce((s,e)=>s+cents(e.amount),0))/100:0}
function irisDebtsMarkup(){return `<button class="primary" onclick="loanForm()">${icon('plus')}Nueva deuda o préstamo</button><div class="credit-grid">${state.loans.map(l=>`<article class="card"><div class="sectiontitle"><h2>${esc(l.name)}</h2><span class="tag">${l.kind}</span></div><p>${esc(l.person)}</p><div class="value">${cash(loanRemaining(l.id),l.currency)}</div><p class="small">Pendiente de ${cash(l.amount,l.currency)} · ${l.date||'Sin vencimiento'}</p><p class="small">${esc(l.note||'')}</p><div class="finance-actions" style="margin-top:16px"><button onclick="loanEntryForm('${l.id}')" ${loanRemaining(l.id)<=0?'disabled':''}>${l.kind==='Por cobrar'?'Registrar cobro':'Registrar devolución'}</button><button onclick="loanForm('${l.id}')">Editar detalles</button></div>${state.loanEntries.filter(e=>e.loanId===l.id).map(e=>`<div class="row"><div class="grow"><strong>${cash(e.amount,l.currency)}</strong><p class="small">${e.date} · ${esc(getAccount(e.accountId)?.name)}</p></div><button class="textbtn" onclick="undoLoanEntry('${e.id}')">Deshacer</button></div>`).join('')}</article>`).join('')||'<section class="card"><div class="empty"><h3>Todo lo pendiente, con nombre</h3><p>Registrá dinero prestado, deudas y sus devoluciones.</p></div></section>'}</div>`}
function loanForm(id){const l=state.loans.find(l=>l.id===id)||{name:'',person:'',kind:'Por cobrar',amount:'',date:'',note:'',accountId:state.accounts.find(a=>!a.archived)?.id};modal(id?'Editar detalles':'Nueva deuda o préstamo',`<form class="form" id="loanForm"><label>Concepto<input name="name" maxlength="100" required value="${esc(l.name)}"></label><label>Persona<input name="person" maxlength="100" required value="${esc(l.person)}"></label>${id?'<p class="small">'+l.kind+' · '+cash(l.amount,l.currency)+'. El importe y el movimiento inicial se conservan.</p>':`<label>Tipo<select name="kind"><option>Por cobrar</option><option>Por pagar</option></select></label><label>Importe<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Cuenta y moneda<select name="accountId">${accountOptions(l.accountId)}</select></label><label style="display:flex;align-items:center;gap:10px"><input type="checkbox" style="width:20px" name="createMove" checked>Registrar también la entrega o recepción del dinero</label><p class="small">Desmarcalo si ya lo registraste antes. Por cobrar descuenta el préstamo de la cuenta; por pagar registra el dinero recibido.</p>`}<label>Vencimiento<input name="date" type="date" value="${l.date}"></label><label>Notas<textarea name="note">${esc(l.note)}</textarea></label><button class="primary">Guardar</button><button type="button" onclick="closeModal()">Cancelar</button></form>`);document.getElementById('loanForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);try{if(id)Object.assign(l,{name:d.get('name').trim(),person:d.get('person').trim(),date:d.get('date'),note:d.get('note').trim()});else storeLoan({...Object.fromEntries(d),createMove:d.get('createMove')==='on'});closeModal();save();notify('Préstamo guardado')}catch(err){notify(err.message)}}}
function storeLoan(d){const a=getAccount(d.accountId),amount=Number(d.amount);if(!a||a.archived||!d.name?.trim()||!d.person?.trim()||!['Por cobrar','Por pagar'].includes(d.kind)||!Number.isFinite(amount)||cents(amount)<=0)throw Error('Revisá la persona, la cuenta y el importe.');if(d.createMove&&d.kind==='Por cobrar'&&cents(amount)>cents(accountBalance(a.id)))throw Error('La cuenta no tiene saldo suficiente.');const l={id:crypto.randomUUID(),name:d.name.trim(),person:d.person.trim(),kind:d.kind,amount:cents(amount)/100,accountId:a.id,currency:a.currency,date:d.date||'',note:d.note||''};state.loans.push(l);if(d.createMove){const movement={id:crypto.randomUUID(),text:l.name,who:l.person,amount:l.amount,accountId:a.id,currency:a.currency,date:localDay(),method:'Otro',category:'Prestado',sourceLoan:l.id};state[d.kind==='Por cobrar'?'expenses':'incomes'].push(movement);l.movementId=movement.id}return l}
function loanEntryForm(id){const l=state.loans.find(l=>l.id===id);if(!l)return;modal(l.kind==='Por cobrar'?'Registrar cobro':'Registrar devolución',`<form class="form" id="loanEntryForm"><label>Importe<input name="amount" type="number" min="0.01" max="${loanRemaining(id)}" step="0.01" value="${loanRemaining(id)}" required></label><label>Cuenta<select name="accountId">${state.accounts.filter(a=>!a.archived&&a.currency===l.currency).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label><label>Fecha<input type="date" name="date" value="${localDay()}" required></label><button class="primary">Registrar</button><button type="button" onclick="closeModal()">Cancelar</button></form>`);document.getElementById('loanEntryForm').onsubmit=e=>{e.preventDefault();try{storeLoanEntry(id,Object.fromEntries(new FormData(e.target)));closeModal();save();notify('Devolución registrada')}catch(err){notify(err.message)}}}
function storeLoanEntry(id,d){const l=state.loans.find(l=>l.id===id),a=getAccount(d.accountId),amount=Number(d.amount);if(!l||!a||a.archived||a.currency!==l.currency||!Number.isFinite(amount)||amount<=0||cents(amount)>cents(loanRemaining(id))||!validCardDate(d.date))throw Error('Revisá la cuenta, el importe y la fecha.');const kind=l.kind==='Por cobrar'?'incomes':'expenses';if(kind==='expenses'&&cents(accountBalance(a.id))<cents(amount))throw Error('El saldo de la cuenta no alcanza.');const entry={id:crypto.randomUUID(),loanId:id,name:l.name,amount:cents(amount)/100,accountId:a.id,date:d.date,kind,movementId:crypto.randomUUID()};state[kind].push({id:entry.movementId,text:'Devolución · '+l.name,amount:entry.amount,date:d.date,accountId:a.id,currency:a.currency,method:'Otro',category:'Prestado',who:l.person,sourceLoan:id});state.loanEntries.push(entry);return entry}
function undoLoanEntry(id){const e=state.loanEntries.find(e=>e.id===id);if(!e)return;state[e.kind]=state[e.kind].filter(m=>m.id!==e.movementId);state.loanEntries=state.loanEntries.filter(v=>v.id!==id);save();notify('Devolución deshecha')}
function goalBalance(id){return state.goalEntries.filter(e=>e.goalId===id).reduce((s,e)=>s+(e.kind==='Aporte'?1:-1)*cents(e.amount),0)/100}
function reservedAccount(id){return state.goals.filter(g=>g.accountId===id).reduce((s,g)=>s+cents(goalBalance(g.id)),0)/100}
function reservedCurrency(currency){return state.goals.filter(g=>g.currency===currency).reduce((s,g)=>s+cents(goalBalance(g.id)),0)/100}
function irisSavingsMarkup(){return `<button class="primary" onclick="goalForm()">${icon('plus')}Nueva meta</button><p class="small" style="margin:12px 0 20px">Las reservas separan dinero dentro de una cuenta; no generan gastos ni transferencias.</p><div class="credit-grid">${state.goals.map(g=>`<article class="card"><h2>${esc(g.name)}</h2><p class="small">${esc(getAccount(g.accountId)?.name)} · ${g.date||'Sin fecha objetivo'}</p><div class="value">${cash(goalBalance(g.id),g.currency)}</div><p class="small">de ${cash(g.target,g.currency)}</p><div class="progress"><span style="width:${Math.min(100,goalBalance(g.id)/g.target*100)}%"></span></div><div class="finance-actions"><button onclick="goalEntryForm('${g.id}','Aporte')">Aportar</button><button onclick="goalEntryForm('${g.id}','Retiro')">Retirar</button><button class="textbtn" onclick="goalForm('${g.id}')">Editar meta</button></div>${accountBalance(g.accountId)<reservedAccount(g.accountId)?'<p class="small" style="margin-top:12px">La cuenta tiene menos saldo que las reservas. Revisá los movimientos o reducí las reservas.</p>':''}</article>`).join('')||'<section class="card"><div class="empty"><h3>Dale un destino a tu ahorro</h3><p>Creá una meta y elegí en qué cuenta vas a reservar el dinero.</p></div></section>'}</div>`}
function goalForm(id){const g=state.goals.find(g=>g.id===id)||{name:'',target:'',date:'',accountId:state.accounts.find(a=>!a.archived)?.id};modal(id?'Editar meta':'Nueva meta',`<form class="form" id="goalForm"><label>Nombre<input name="name" maxlength="100" required value="${esc(g.name)}"></label><label>Objetivo<input type="number" name="target" min="0.01" step="0.01" required value="${g.target}"></label><label>Cuenta<select name="accountId" ${id?'disabled':''}>${accountOptions(g.accountId,true)}</select></label><label>Fecha objetivo<input name="date" type="date" value="${g.date}"></label><button class="primary">Guardar meta</button><button type="button" onclick="closeModal()">Cancelar</button></form>`);document.getElementById('goalForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),name=d.get('name').trim(),target=Number(d.get('target')),a=getAccount(id?g.accountId:d.get('accountId'));if(!name||!a||!Number.isFinite(target)||target<=0)return;const v={name,target:cents(target)/100,date:d.get('date'),accountId:a.id,currency:a.currency};if(id)Object.assign(g,v);else state.goals.push({id:crypto.randomUUID(),...v});closeModal();save();notify('Meta guardada')}}
function goalEntryForm(id,kind){const g=state.goals.find(g=>g.id===id);if(!g)return;modal(kind+' a '+g.name,`<form class="form" id="goalEntryForm"><p class="small">Reservado: ${cash(goalBalance(id),g.currency)} · Libre en cuenta: ${cash(accountBalance(g.accountId)-reservedAccount(g.accountId),g.currency)}</p><label>Importe<input name="amount" type="number" min="0.01" step="0.01" required></label><button class="primary">${kind==='Aporte'?'Reservar dinero':'Liberar reserva'}</button><button type="button" onclick="closeModal()">Cancelar</button></form>`);document.getElementById('goalEntryForm').onsubmit=e=>{e.preventDefault();try{storeGoalEntry(id,kind,new FormData(e.target).get('amount'));closeModal();save();notify(kind==='Aporte'?'Dinero reservado':'Reserva liberada')}catch(err){notify(err.message)}}}
function storeGoalEntry(id,kind,raw){const g=state.goals.find(g=>g.id===id),amount=Number(raw);if(!g||!['Aporte','Retiro'].includes(kind)||!Number.isFinite(amount)||cents(amount)<=0)throw Error('Ingresá un importe válido.');if(kind==='Aporte'&&(getAccount(g.accountId)?.archived||cents(amount)>cents(accountBalance(g.accountId)-reservedAccount(g.accountId))))throw Error('No hay suficiente saldo sin reservar en la cuenta.');if(kind==='Retiro'&&cents(amount)>cents(goalBalance(id)))throw Error('El retiro supera el dinero reservado.');const e={id:crypto.randomUUID(),goalId:id,name:g.name,kind,amount:cents(amount)/100,date:localDay()};state.goalEntries.push(e);return e}
const rawRemoveItem=removeItem;removeItem=function(kind,id){const e=state[kind]?.find(e=>e.id===id);if(e?.sourceLoan||e?.sourceService){notify('Este movimiento se administra desde '+(e.sourceLoan?'Deudas y préstamos.':'Servicios.'));return}rawRemoveItem(kind,id)};
const rawMovementForm=movementForm;movementForm=function(kind,id){const e=state[kind]?.find(e=>e.id===id);if(e?.sourceLoan||e?.sourceService){modal('Movimiento vinculado','<p>Este registro pertenece a '+(e.sourceLoan?'un préstamo.':'un servicio.')+'</p><button style="margin-top:16px" onclick="closeModal();go(\''+(e.sourceLoan?'debts':'services')+'\')">Ver registro de origen</button>');return}rawMovementForm(kind,id)};

function postedIris(r){return !r.voided&&(!r.sourceLoan||!state.loans.find(l=>l.id===r.sourceLoan)?.cancelled)}

accountBalance=function(id,excludeTransfer){const a=getAccount(id);if(!a)return 0;let total=cents(a.opening);for(const r of state.incomes)if(postedIris(r)&&(r.accountId||'legacy')===id)total+=cents(r.amount);for(const r of state.expenses)if(postedIris(r)&&(r.accountId||'legacy')===id)total-=cents(r.amount);for(const t of state.transfers){if(t.id===excludeTransfer)continue;if(t.fromId===id)total-=cents(t.amount);if(t.toId===id)total+=cents(t.received)}for(const p of state.cardPayments)if(p.accountId===id)total-=cents(p.amount);return total/100};

irisEntries=function(){return [...state.incomes.filter(postedIris).map(r=>({...r,kind:'incomes'})),...state.expenses.filter(postedIris).map(r=>({...r,kind:'expenses'})),...state.transfers.map(r=>({...r,text:r.note||'Transferencia entre cuentas',kind:'transfers',method:'Transferencia'})),...cardSpendRows(),...state.cardPayments.map(p=>({...p,text:'Pago de '+(getCard(p.cardId)?.name||'tarjeta'),kind:'payments',currency:getCard(p.cardId)?.currency,method:'Pago de tarjeta',category:'Movimiento interno'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||String(b.id).localeCompare(String(a.id)))};

// The visible editor uses es-AR; the original named field keeps a canonical
// numeric value so existing forms and accounting never parse grouped strings.
function groupedNumberText(raw){
  const text=String(raw??'');
  if(!text)return '';
  const match=text.match(/^(-?)(\d*)(?:\.(\d*))?$/);
  if(!match)return text;
  const whole=(match[2]||'0').replace(/^0+(?=\d)/,'');
  return match[1]+whole.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(match[3]!==undefined?','+match[3]:'');
}
function canonicalNumberText(text){
  text=String(text??'').trim().replace(/[\s\u00a0\u202f]/g,'');
  if(!text)return '';
  // Local notation: periods group thousands; comma separates decimals.
  if(!/^-?[\d.]*,?\d*$/.test(text)||text==='-'||text==='.'||text===',')return null;
  const raw=text.replace(/\./g,'').replace(',','.');
  return /^-?\d+(?:\.\d*)?$/.test(raw)?raw:null;
}
let numberEditorSequence=0;
function prepareNumberEditors(root=document){
  root.querySelectorAll('input[type="number"]:not([data-number-raw])').forEach(raw=>{
    const editor=raw.cloneNode(false),getValue=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value');
    if(!getValue?.get||!getValue?.set)return;
    const initial=raw.value,originalId=raw.id;
    raw.dataset.numberRaw='true';raw.type='hidden';raw.removeAttribute('required');raw.removeAttribute('autofocus');
    editor.type='text';editor.removeAttribute('name');editor.removeAttribute('value');
    editor.id=(originalId||'number-'+(++numberEditorSequence))+'-editor';
    editor.dataset.numberEditor='true';editor.setAttribute('inputmode',raw.getAttribute('step')==='1'?'numeric':'decimal');
    editor.setAttribute('autocomplete','off');editor.setAttribute('spellcheck','false');
    for(const attr of [...editor.attributes])if(/^on/i.test(attr.name))editor.removeAttribute(attr.name);
    if(originalId)document.querySelectorAll('label[for]').forEach(label=>{if(label.htmlFor===originalId)label.htmlFor=editor.id});
    raw.after(editor);
    const syncState=()=>{editor.disabled=raw.disabled;editor.readOnly=raw.readOnly};
    const validate=()=>{
      if(!editor.setCustomValidity)return;
      const value=canonicalNumberText(editor.value),n=Number(value),min=raw.getAttribute('min'),max=raw.getAttribute('max'),step=raw.getAttribute('step');
      let message='';
      if(value===null)message='Ingresá un número válido. Usá coma para los decimales.';
      else if(value!==''){
        if(!Number.isFinite(n))message='Ingresá un número válido.';
        else if(min!==null&&n<Number(min))message='El mínimo es '+groupedNumberText(min)+'.';
        else if(max!==null&&n>Number(max))message='El máximo es '+groupedNumberText(max)+'.';
        else if(step&&step!=='any'&&Number(step)>0){const units=(n-Number(min||0))/Number(step);if(Math.abs(units-Math.round(units))>1e-6)message='Usá incrementos de '+groupedNumberText(step)+'.'}
      }
      editor.setCustomValidity(message);
    };
    const show=value=>{editor.value=groupedNumberText(value);syncState();validate()};
    Object.defineProperty(raw,'value',{configurable:true,get(){return getValue.get.call(raw)},set(value){getValue.set.call(raw,value);show(String(value??''))}});
    raw.value=initial;
    editor.addEventListener('input',()=>{
      const text=editor.value,caret=editor.selectionStart??text.length,left=text.slice(0,caret).replace(/\./g,'').length;
      const value=canonicalNumberText(text);
      getValue.set.call(raw,value===null?'':value);
      if(value!==null){editor.value=groupedNumberText(value);let position=0,count=0;while(position<editor.value.length&&count<left){if(editor.value[position]!=='.')count++;position++}editor.setSelectionRange?.(position,position)}
      validate();raw.dispatchEvent(new window.Event('input',{bubbles:true}));
    });
    editor.addEventListener('change',()=>{validate();raw.dispatchEvent(new window.Event('change',{bubbles:true}))});
    editor.addEventListener('blur',()=>{const v=canonicalNumberText(editor.value);if(v!==null&&v!==''){raw.value=String(Number(v))}validate()});
    raw.form?.addEventListener('reset',()=>{queueMicrotask(()=>{raw.value=raw.defaultValue})});
    if(typeof window.MutationObserver==='function')new window.MutationObserver(syncState).observe(raw,{attributes:true,attributeFilter:['disabled','readonly']});
  });
}
