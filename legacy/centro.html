function homeWidgets(){const completed=state.tasks.filter(t=>t.done).length;let summaries={iris:[money(balance()),'Disponible · ARS','expenses'],space:[state.paid?'Al día':'1 pendiente',state.paid?'Electricidad pagada':'Electricidad: '+money(45000),'space'],tasks:[completed+' / '+state.tasks.length,'Tareas completadas','tasks'],notes:[state.notes.length+' '+(state.notes.length===1?'nota':'notas'),'Ideas guardadas','notes'],incomeSummary:[money(state.incomes.filter(e=>recordCurrency(e)==='ARS').reduce((a,e)=>a+e.amount,0)),'Ingresos · ARS','expenses']};return `<div class="board">${state.widgetOrder.filter(k=>widgetCatalog[k]).map(k=>{let w=widgetCatalog[k],size=state.widgetSizes[k]||(w.wide?'wide':'small'),cls=(size==='wide'?'wide':size==='full'?'full':'')+' size-'+size;if(summaries[k]){let [v,d,page]=summaries[k];return `<button class="card widget ${cls}" data-home-widget="${k}" onclick="go('${page}')"><div class="widgettop"><span class="tile">${icon(w.icon)}</span>${w.name==='Saldo de Iris'?'Iris':w.name}<span style="margin-left:auto">${icon('arrow')}</span></div><div class="value">${v}</div><p class="small">${d}</p>${k==='tasks'?`<div class="progress"><span style="width:${state.tasks.length?completed/state.tasks.length*100:0}%"></span></div>`:''}</button>`}let actions={newEvent:['eventForm()','Crear evento'],income:['incomeForm()','Anotar ingreso'],expense:['expenseForm()','Anotar gasto'],quickNote:['noteForm()','Escribir nota'],newTask:['taskForm()','Agregar tarea']};if(actions[k])return `<button class="action-widget" data-home-widget="${k}" onclick="${actions[k][0]}">${icon(w.icon)}<span>${actions[k][1]}</span>${icon('plus')}</button>`;let content={agenda:()=>cardTitle('Agenda de hoy','eventForm()','+ Evento')+agendaRows(state.events.filter(e=>e.date===localDay())),priorities:()=>cardTitle('Tus prioridades','taskForm()','+ Tarea')+taskRows(state.tasks.filter(t=>!t.done)),electric:()=>'<h2>Tu hogar, al día</h2>'+electric(),movements:()=>cardTitle('Últimos gastos' function startWidgetDrag(e){if(e.button!==0||editorPreview)return;e.preventDefault();const cell=e.currentTarget.closest('.edit-cell'),rect=cell.getBoundingClientRect(),ghost=cell.cloneNode(true);ghost.classList.add('drag-ghost');ghost.style.width=rect.width+'px';ghost.style.left=rect.left+'px';ghost.style.top=rect.top+'px';document.body.appendChild(ghost);cell.classList.add('dragging');dragState={cell,ghost,k:cell.dataset.widget,x:e.clientX,y:e.clientY,dx:e.clientX-rect.left,dy:e.clientY-rect.top,original:[...widgetDraft],pointer:e.pointerId};document.addEventListener('pointermove',moveWidgetDrag,{passive:false});document.addEventListener('pointerup',endWidgetDrag);document.addEventListener('pointercancel',cancelWidgetDrag);dragTick()}

function dragTick(){const d=dragState;if(!d)return;d.ghost.style.left=(d.x-d.dx)+'px';d.ghost.style.top=(d.y-d.dy)+'px';const toolbar=document.querySelector('.edit-toolbar').getBoundingClientRect();if(d.y>innerHeight-70)window.scrollBy(0,10);else if(d.y<toolbar.bottom+50)window.scrollBy(0,-10);const target=document.elementFromPoint(d.x,d.y)?.closest('.edit-cell');if(target&&target!==d.cell){const r=target.getBoundingClientRect(),sameRow=Math.abs(r.top-d.cell.getBoundingClientRect().top)<20,after=sameRow?d.x>r.left+r.width/2:d.y>r.top+r.height/2;target.parentElement.insertBefore(d.cell,after?target.nextSibling:target);widgetDraft=[...target.parentElement.children].map(el=>el.dataset.widget)}d.frame=requestAnimationFrame(dragTick)}

document.getElementById('search').oninput=e=>{query=e.target.value.trim();if(view!=='search'){view='search';searchFilter='all'}render()};document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Escape')clearSearch()});document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){let r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>{if(!e.target.closest('input,textarea'))e.preventDefault()},{passive:false});function localDay(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function getCard(id){return state.cards.find(c=>c.id===id)}
function dateAtMonth(month,day){const [y,m]=month.split('-').map(Number);return y+'-'+String(m).padStart(2,'0')+'-'+String(Math.min(day,new Date(y,m,0).getDate())).padStart(2,'0')}
function shiftMonth(month,n){const [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function firstCardMonth(card,date){const month=date.slice(0,7),close=dateAtMonth(month,card.closeDay);const cycleMonth=date>close?shiftMonth(month,1):month;return card.dueDay>card.closeDay?cycleMonth:shiftMonth(cycleMonth,1)}
function cardSchedule(p){const total=cents(p.amount),base=Math.floor(total/p.installments),extra=total%p.installments;return Array.from({length:p.installments},(_,i)=>({purchaseId:p.id,text:p.text,number:i+1,count:p.installments,date:dateAtMonth(shiftMonth(p.firstMonth,i),p.dueDay),amount:(base+(i<extra?1:0))/100}))}
function cardDebt(id){return (state.cardPurchases.filter(p=>p.cardId===id).reduce((a,p)=>a+cents(p.amount),0)-state.cardPayments.filter(p=>p.cardId===id).reduce((a,p)=>a+cents(p.amount),0))/100}
function cardCycleTotal(card,today=localDay()){let month=today.slice(0,7),end=dateAtMonth(month,card.closeDay);if(today>end){month=shiftMonth(month,1);end=dateAtMonth(month,card.closeDay)}const start=dateAtMonth(shiftMonth(month,-1),card.closeDay);return state.cardPurchases.filter(p=>p.cardId===card.id&&p.date>start&&p.date<=end).reduce((a,p)=>a+cents(p.amount),0)/100}

function storeCard(d,id){const old=getCard(id),name=String(d.name||'').trim(),limit=Number(d.limit),closeDay=Number(d.closeDay),dueDay=Number(d.dueDay),locked=old&&state.cardPurchases.some(p=>p.cardId===id),currency=locked?old.currency:d.currency;if(!name||!['ARS','USD','EUR'].includes(currency)||!Number.isFinite(limit)||limit<=0||limit>999999999||![closeDay,dueDay].every(n=>Number.isInteger(n)&&n>=1&&n<=31))throw Error('Revisá el nombre, el límite y los días (del 1 al 31).');if(old&&cents(limit)<cents(cardDebt(id)))throw Error('El límite no puede ser menor que el saldo pendiente.');const value={name,currency,limit:cents(limit)/100,closeDay,dueDay};if(old)Object.assign(old,value);else state.cards.push({id:crypto.randomUUID(),archived:false,...value});return old||state.cards.at(-1)}

function groupedNumberText(raw){
