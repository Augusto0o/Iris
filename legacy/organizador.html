function calendarMarkup(){const [y,m]=activeMonth.split('-').map(Number),first=new Date(y,m-1,1),offset=(first.getDay()+6)%7,days=new Date(y,m,0).getDate(),title=first.toLocaleDateString('es-AR',{month:'long',year:'numeric'});return head('Calendario','Tus tareas y eventos, con lugar en el día.',"edit('events')",'Nuevo evento')+`<div class="grid"><section class="card"><div class="sectionhead"><button class="iconbtn" onclick="calendarMonth(-1)" aria-label="Mes anterior">${icon('left')}</button><h2 style="text-transform:capitalize">${title}</h2><button class="iconbtn" onclick="calendarMonth(1)" aria-label="Mes siguiente">${icon('right')}</button></div><div class="month-grid">${['L','M','M','J','V','S','D'].map(d=>'<div class="weekday">'+d+'</div>').join('')}${'<div></div>'.repeat(offset)}${Array.from({length:days},(_,i)=>{const day=activeMonth+'-'+String(i+1).padStart(2,'0'),events=R('events').filter(v=>v.date===day),tasks=R('tasks').filter(v=>v.date===day&&!v.done);return `<button class="day-cell ${day===today()?'today':''} ${day===selectedDate?'selected':''}" onclick="selectedDate='${day}';render()" aria-label="${day}, ${events.length} eventos y ${tasks.length} tareas"><span>${i+1}</span>${events.length||tasks.length?'<span class="event-dot"></span><span class="small">'+(events.length+tasks.length)+' pendientes</span>':''}</button>`}).join('')}</div><button class="ghost" style="margin-top:14px" onclick="selectedDate=today();activeMonth=month();render()">Volver a hoy</button></section><div class="form">${section('Agenda del '+selectedDate,eventRows(R('events').filter(v=>v.date===selectedDate)),"edit('events')",'Agregar')}${section('Tareas del día',taskRows(R('tasks').filter(v=>v.date===selectedDate&&!v.done)),'taskForm()','Agregar')}</div></div>`}

// The visible editor uses es-AR; the original named field keeps a canonical
// numeric value so existing forms and accounting never parse grouped strings.
function groupedNumberText(raw){
  const text=String(raw??'');
  if(!text)return '';
  const match=text.match(/^(-?)(\d*)(?:\.(\d*))?$/);
  if(!match)return text;
  const whole=(match[2]||'0').replace(/^0+(?=\d)/,'');
  return match[1]+whole.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(match[3]!==undefined?','+match[3]:'');

function canonicalNumberText(text){

  if(!/^-?[\d.]*,?\d*$/.test(text)||text==='-'||text==='.'||text===',')return null;

  return /^-?\d+(?:\.\d*)?$/.test(raw)?raw:null;
