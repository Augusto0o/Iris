const markupBeforePDF=appMarkup;appMarkup=function(v){let html=markupBeforePDF(v);if(v==='library')for(const r of R('library').filter(r=>r.attachment)){const actions=cardActions('library',r.id);html=html.replace(actions,`<button onclick="openLibraryPDF('${r.id}')">${icon('book')}Abrir PDF</button>`+actions)}return html};
function openLibraryPDF(id){const r=record('library',id);if(!r?.attachment)return;const bytes=Uint8Array.from(atob(r.attachment.split(',')[1]),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}

const ORIGINAL_LESSONS=[{"id":"a1-introductions","level":"A1","title":"Presentarte","topic":"Introductions","minutes":6,"vocab":[{"en":"name","es":"nombre","example":"My name is Franco."},{"en":"nice to meet you","es":"encantado de conocerte","example":"Hi, Anna. Nice to meet you."},{"en":"where are you from?","es":"¿de dónde sos?","example":"Where are you from? — I’m from Argentina."},{"en":"job","es":"trabajo","example":"What’s your job?"},{"en":"live","es":"vivir","example":"I live in Buenos Aires."},{"en":"work","es":"trabajar","example":"I work in design."},{"en":"city","es":"ciudad","example":"It’s a big city."},{"en":"married","es":"casado/a","example":"Are you married?"}],"grammar":{"title":"Verbo to be (am / is / are)","explain":"Usamos «to be» para decir quiénes somos, de dónde somos y cómo estamos. I → am, he/she/it → is, you/we/they → are.","examples":[{"en":"I am a designer.","es":"Soy diseñador."},{"en":"She is from Chile.","es":"Ella es de Chile."},{"en":"We are friends.","es":"Somos amigos."}],"exercises":[{"prompt":"I ___ from Argentina.","options":["am","is","are"],"answer":"am"},{"prompt":"They ___ my colleagues.","options":["am","is","are"],"answer":"are"},{"prompt":"My sister ___ a teacher.","options":["am","is","are"],"answer":"is"}]},"dialogue":[{"speaker":"A","en":"Hi! I’m Anna. What’s your name?","es":"¡Hola! Soy Anna. ¿Cómo te llamás?"},{"speaker":"B","en":"Hi, Anna. I’m Franco. Nice to meet you.","es":"Hola, Anna. Soy Franco. Encantado."},{"speaker":"A","en":"Nice to meet you too. Where are you from?","es":"Igualmente. ¿De dónde sos?"},{"speaker":"B","en":"I’m from Argentina. I live in Buenos Aires.","es":"Soy de Argentina. Vivo en Buenos Aires."},{"speaker":"A","en":"Cool! What do you do?","es":"¡Qué bueno! ¿A qué te dedicás?"},{"speaker":"B","en":"I have a small company. And you?","es":"Tengo una empresa chica. ¿Y vos?"},{"speaker":"A","en":"I’m a nurse. I work at a hospital.","es":"Soy enfermera. Trabajo en un hospital."}],"questions":[{"q":"Where does Franco live?","options":["In Chile","In Buenos Aires","In a hospital"],"answer":1},{"q":"What is Anna’s job?","options":["Designer","Teacher","Nurse"],"answer":2}],"speak":[{"en":"My name is Franco and I live in Buenos Aires.","es":"Me llamo Franco y vivo en Buenos Aires."},{"en":"Nice to meet you.","es":"Encantado de conocerte."},{"en":"I have a small company.","es":"Tengo una empresa chica."}]},{"id":"a1-ordering-food","level":"A1","title":"Pedir comida","topic":"Ordering food","minutes":7,"vocab":[{"en":"menu","es":"carta, menú","example":"Can I see the menu, please?"},{"en":"I’d like…","es":"quisiera…","example":"I’d like a coffee, please."},{"en":"water","es":"agua","example":"A bottle of water, please."},{"en":"the bill","es":"la cuenta","example":"Can we have the bill?"},{"en":"dessert","es":"postre","example":"Would you like dessert?"},{"en":"to go","es":"para llevar","example":"A sandwich to go, please."},{"en":"without","es":"sin","example":"A salad without onion."},{"en":"delicious","es":"delicioso","example":"The pasta is delicious."}],"grammar":{"title":"Pedidos amables: I’d like / Can I have…?","explain":"«I’d like» (= I would like) y «Can I have…?» son las formas educadas de pedir. «I want» suena brusco en un restaurante.","examples":[{"en":"I’d like the chicken, please.","es":"Quisiera el pollo, por favor."},{"en":"Can I have some water?","es":"¿Me das un poco de agua?"}],"exercises":[{"prompt":"___ like a green tea, please.","options":["I’d","I","I’m"],"answer":"I’d"},{"prompt":"Can I ___ the bill, please?","options":["have","has","having"],"answer":"have"},{"prompt":"A burger ___ cheese, please. (sin queso)","options":["with","without","and"],"answer":"without"}]},"dialogue":[{"speaker":"A","en":"Good evening. Are you ready to order?","es":"Buenas noches. ¿Listos para pedir?"},{"speaker":"B","en":"Yes. I’d like the vegetable soup, please.","es":"Sí. Quisiera la sopa de verduras, por favor."},{"speaker":"A","en":"Of course. Anything to drink?","es":"Claro. ¿Algo para tomar?"},{"speaker":"B","en":"Just water, please. Sparkling.","es":"Solo agua, por favor. Con gas."},{"speaker":"A","en":"Would you like dessert later?","es":"¿Va a querer postre después?"},{"speaker":"B","en":"Maybe. Can I see the dessert menu?","es":"Tal vez. ¿Puedo ver la carta de postres?"},{"speaker":"A","en":"Sure, here you are.","es":"Claro, aquí tiene."}],"questions":[{"q":"What does the customer order?","options":["Vegetable soup","Chicken","A burger"],"answer":0},{"q":"What does the customer drink?","options":["Still water","Sparkling water","Coffee"],"answer":1}],"speak":[{"en":"I’d like the vegetable soup, please.","es":"Quisiera la sopa de verduras, por favor."},{"en":"Can we have the bill, please?","es":"¿Nos trae la cuenta, por favor?"},{"en":"A coffee to go, please.","es":"Un café para llevar, por favor."}]},{"id":"a1-daily-routine","level":"A1","title":"Tu rutina diaria","topic":"Daily routine","minutes":6,"vocab":[{"en":"wake up","es":"despertarse","example":"I wake up at seven."},{"en":"have breakfast","es":"desayunar","example":"I have breakfast at home."},{"en":"go to work","es":"ir a trabajar","example":"I go to work by bike."},{"en":"usually","es":"normalmente","example":"I usually cook dinner."},{"en":"never","es":"nunca","example":"I never drink coffee at night."},{"en":"in the afternoon","es":"a la tarde","example":"I go to the gym in the afternoon."},{"en":"go to bed","es":"irse a dormir","example":"I go to bed at eleven."},{"en":"early","es":"temprano","example":"She gets up early."}],"grammar":{"title":"Presente simple (he/she + -s)","explain":"Para hábitos usamos el presente simple. Con he, she e it el verbo lleva -s: I work → she works; I go → he goes.","examples":[{"en":"I read before bed.","es":"Leo antes de dormir."},{"en":"He works from home.","es":"Él trabaja desde casa."}],"exercises":[{"prompt":"She ___ up at six.","options":["wake","wakes","waking"],"answer":"wakes"},{"prompt":"I ___ to the gym on Mondays.","options":["go","goes","going"],"answer":"go"},{"prompt":"My brother ___ coffee. (nunca)","options":["never drinks","drinks never","never drink"],"answer":"never drinks"}]},"dialogue":[{"speaker":"A","en":"What time do you usually wake up?","es":"¿A qué hora te despertás normalmente?"},{"speaker":"B","en":"At half past six. I have breakfast and read a little.","es":"A las seis y media. Desayuno y leo un poco."},{"speaker":"A","en":"Wow, early! Do you go to the office?","es":"¡Uy, temprano! ¿Vas a la oficina?"},{"speaker":"B","en":"Three days a week. On the other days I work from home.","es":"Tres días por semana. Los otros trabajo desde casa."},{"speaker":"A","en":"And in the afternoon?","es":"¿Y a la tarde?"},{"speaker":"B","en":"I go to the gym, then I cook dinner.","es":"Voy al gimnasio y después cocino."}],"questions":[{"q":"When does B wake up?","options":["6:00","6:30","7:30"],"answer":1},{"q":"How many days does B go to the office?","options":["Two","Three","Five"],"answer":1}],"speak":[{"en":"I usually wake up at seven.","es":"Normalmente me despierto a las siete."},{"en":"I go to the gym in the afternoon.","es":"Voy al gimnasio a la tarde."},{"en":"I never check my phone in bed.","es":"Nunca miro el teléfono en la cama."}]},{"id":"a1-time-numbers","level":"A1","title":"La hora y los números","topic":"Time and numbers","minutes":5,"vocab":[{"en":"o’clock","es":"en punto","example":"It’s three o’clock."},{"en":"half past","es":"y media","example":"It’s half past eight."},{"en":"quarter to","es":"menos cuarto","example":"It’s quarter to five."},{"en":"appointment","es":"turno, cita","example":"I have an appointment at ten."},{"en":"late","es":"tarde","example":"Sorry, I’m late."},{"en":"on time","es":"a tiempo","example":"The train is on time."},{"en":"fifteen","es":"quince","example":"Fifteen minutes, please."},{"en":"fifty","es":"cincuenta","example":"It costs fifty dollars."}],"grammar":{"title":"Preposiciones de tiempo: at / on / in","explain":"«at» para horas (at 5 pm), «on» para días (on Monday) e «in» para meses, años y partes del día (in July, in the morning).","examples":[{"en":"The meeting is at ten.","es":"La reunión es a las diez."},{"en":"My birthday is in May.","es":"Mi cumpleaños es en mayo."}],"exercises":[{"prompt":"See you ___ Friday!","options":["at","on","in"],"answer":"on"},{"prompt":"The class starts ___ 9:30.","options":["at","on","in"],"answer":"at"},{"prompt":"We travel ___ December.","options":["at","on","in"],"answer":"in"}]},"dialogue":[{"speaker":"A","en":"Excuse me, what time is it?","es":"Disculpá, ¿qué hora es?"},{"speaker":"B","en":"It’s quarter to three.","es":"Son las tres menos cuarto."},{"speaker":"A","en":"Oh no, my appointment is at three!","es":"¡Uy, mi turno es a las tres!"},{"speaker":"B","en":"Don’t worry, the clinic is five minutes from here.","es":"Tranquilo, la clínica está a cinco minutos."},{"speaker":"A","en":"Thanks! I don’t want to be late.","es":"¡Gracias! No quiero llegar tarde."}],"questions":[{"q":"What time is it?","options":["2:45","3:15","3:00"],"answer":0},{"q":"How far is the clinic?","options":["Fifteen minutes","Five minutes","Fifty minutes"],"answer":1}],"speak":[{"en":"It’s half past eight.","es":"Son las ocho y media."},{"en":"My appointment is on Monday at ten.","es":"Mi turno es el lunes a las diez."},{"en":"Sorry, I’m a little late.","es":"Perdón, llegué un poco tarde."}]},{"id":"a2-last-weekend","level":"A2","title":"Tu último fin de semana","topic":"Last weekend","minutes":7,"vocab":[{"en":"went","es":"fui (go)","example":"I went to the beach."},{"en":"had dinner","es":"cené","example":"We had dinner with friends."},{"en":"stayed","es":"me quedé","example":"I stayed at home on Sunday."},{"en":"relaxing","es":"relajante","example":"It was a relaxing weekend."},{"en":"tired","es":"cansado","example":"I was very tired."},{"en":"met","es":"me encontré con (meet)","example":"I met an old friend."},{"en":"yesterday","es":"ayer","example":"Yesterday I cooked pasta."},{"en":"ago","es":"hace (tiempo)","example":"Two days ago."}],"grammar":{"title":"Pasado simple (regulares e irregulares)","explain":"Los regulares suman -ed (work → worked). Los irregulares cambian (go → went, have → had, see → saw). En negativo y preguntas se usa did + verbo base.","examples":[{"en":"I watched a movie.","es":"Vi una película."},{"en":"Did you go out? — No, I didn’t.","es":"¿Saliste? — No."}],"exercises":[{"prompt":"Yesterday I ___ to the gym.","options":["go","went","goed"],"answer":"went"},{"prompt":"We ___ dinner with my parents.","options":["have","had","haved"],"answer":"had"},{"prompt":"___ you see the game?","options":["Do","Did","Was"],"answer":"Did"}]},"dialogue":[{"speaker":"A","en":"How was your weekend?","es":"¿Qué tal tu finde?"},{"speaker":"B","en":"Really good! On Saturday I went to the gym and then I had dinner with my friends.","es":"¡Muy bueno! El sábado fui al gimnasio y después cené con amigos."},{"speaker":"A","en":"Nice. Where did you go?","es":"Qué lindo. ¿Adónde fueron?"},{"speaker":"B","en":"A small Italian place near my house. The pasta was amazing.","es":"A un lugar italiano chiquito cerca de casa. La pasta era increíble."},{"speaker":"A","en":"And Sunday?","es":"¿Y el domingo?"},{"speaker":"B","en":"I stayed at home and read. I was tired.","es":"Me quedé en casa leyendo. Estaba cansado."}],"questions":[{"q":"What did B do on Saturday?","options":["Stayed at home","Went to the gym and had dinner","Went to the beach"],"answer":1},{"q":"Why did B stay at home on Sunday?","options":["It rained","B was tired","B had to work"],"answer":1}],"speak":[{"en":"Yesterday I went to the gym and then I had dinner with my friends.","es":"Ayer fui al gimnasio y después cené con amigos."},{"en":"I stayed at home on Sunday.","es":"El domingo me quedé en casa."},{"en":"It was a relaxing weekend.","es":"Fue un fin de semana tranquilo."}]},{"id":"a2-shopping","level":"A2","title":"De compras","topic":"Shopping","minutes":6,"vocab":[{"en":"how much is it?","es":"¿cuánto cuesta?","example":"How much is this jacket?"},{"en":"size","es":"talle","example":"Do you have it in a bigger size?"},{"en":"try on","es":"probarse","example":"Can I try it on?"},{"en":"fitting room","es":"probador","example":"The fitting room is over there."},{"en":"cheaper","es":"más barato","example":"Do you have something cheaper?"},{"en":"receipt","es":"ticket, recibo","example":"Here’s your receipt."},{"en":"refund","es":"reembolso","example":"Can I get a refund?"},{"en":"on sale","es":"en oferta","example":"These shoes are on sale."}],"grammar":{"title":"Comparativos (-er / more)","explain":"Adjetivos cortos suman -er (cheap → cheaper, big → bigger). Los largos usan «more» (expensive → more expensive). Irregulares: good → better, bad → worse.","examples":[{"en":"This one is cheaper.","es":"Este es más barato."},{"en":"The blue shirt is more comfortable.","es":"La camisa azul es más cómoda."}],"exercises":[{"prompt":"This bag is ___ than that one. (big)","options":["more big","bigger","biggest"],"answer":"bigger"},{"prompt":"The black coat is ___ expensive.","options":["more","most","-er"],"answer":"more"},{"prompt":"This size is ___ for me. (good)","options":["gooder","better","more good"],"answer":"better"}]},"dialogue":[{"speaker":"A","en":"Hi, can I help you?","es":"Hola, ¿te ayudo?"},{"speaker":"B","en":"Yes, how much is this jacket?","es":"Sí, ¿cuánto cuesta esta campera?"},{"speaker":"A","en":"It’s eighty dollars, but it’s on sale today: sixty.","es":"Ochenta dólares, pero hoy está en oferta: sesenta."},{"speaker":"B","en":"Great. Can I try it on in a medium?","es":"Genial. ¿Me la pruebo en mediano?"},{"speaker":"A","en":"Sure, the fitting room is on the left.","es":"Claro, el probador está a la izquierda."},{"speaker":"B","en":"Hmm, it’s a bit small. Do you have a bigger size?","es":"Mmm, me queda un poco chica. ¿Tenés un talle más grande?"}],"questions":[{"q":"How much is the jacket today?","options":["$80","$60","$16"],"answer":1},{"q":"What’s the problem with the jacket?","options":["Too expensive","Too small","Wrong color"],"answer":1}],"speak":[{"en":"How much is this jacket?","es":"¿Cuánto cuesta esta campera?"},{"en":"Can I try it on?","es":"¿Me la puedo probar?"},{"en":"Do you have a bigger size?","es":"¿Tenés un talle más grande?"}]},{"id":"a2-directions","level":"A2","title":"Pedir indicaciones","topic":"Asking for directions","minutes":6,"vocab":[{"en":"turn left","es":"doblar a la izquierda","example":"Turn left at the bank."},{"en":"go straight","es":"seguir derecho","example":"Go straight for two blocks."},{"en":"block","es":"cuadra","example":"It’s three blocks from here."},{"en":"next to","es":"al lado de","example":"The pharmacy is next to the café."},{"en":"opposite","es":"enfrente de","example":"It’s opposite the station."},{"en":"corner","es":"esquina","example":"On the corner of Main Street."},{"en":"far","es":"lejos","example":"Is it far?"},{"en":"get lost","es":"perderse","example":"I always get lost here."}],"grammar":{"title":"Imperativos y preguntas indirectas","explain":"Las indicaciones usan el imperativo (Turn left, Go straight). Para preguntar con cortesía: «Could you tell me where the station is?» — el verbo va al final.","examples":[{"en":"Take the second street on the right.","es":"Tomá la segunda calle a la derecha."},{"en":"Could you tell me where the museum is?","es":"¿Me podrías decir dónde está el museo?"}],"exercises":[{"prompt":"Could you tell me where the bank ___?","options":["is","is it","it is is"],"answer":"is"},{"prompt":"___ straight and turn right.","options":["Going","Go","Goes"],"answer":"Go"},{"prompt":"The café is ___ the bookstore. (al lado de)","options":["opposite","next to","far"],"answer":"next to"}]},"dialogue":[{"speaker":"A","en":"Excuse me, could you tell me where the train station is?","es":"Disculpe, ¿me podría decir dónde está la estación de tren?"},{"speaker":"B","en":"Sure. Go straight for two blocks and turn left at the bank.","es":"Claro. Siga derecho dos cuadras y doble a la izquierda en el banco."},{"speaker":"A","en":"Is it far?","es":"¿Queda lejos?"},{"speaker":"B","en":"No, about ten minutes on foot. It’s opposite a big park.","es":"No, unos diez minutos caminando. Está enfrente de un parque grande."},{"speaker":"A","en":"Perfect, thank you so much!","es":"¡Perfecto, muchas gracias!"}],"questions":[{"q":"Where should A turn left?","options":["At the park","At the bank","At the corner café"],"answer":1},{"q":"How long is the walk?","options":["About ten minutes","Two minutes","Half an hour"],"answer":0}],"speak":[{"en":"Could you tell me where the station is?","es":"¿Me podría decir dónde está la estación?"},{"en":"Go straight and turn left at the bank.","es":"Siga derecho y doble a la izquierda en el banco."},{"en":"Is it far from here?","es":"¿Queda lejos de acá?"}]},{"id":"a2-health","level":"A2","title":"En el médico","topic":"At the doctor","minutes":6,"vocab":[{"en":"headache","es":"dolor de cabeza","example":"I have a headache."},{"en":"sore throat","es":"dolor de garganta","example":"She has a sore throat."},{"en":"fever","es":"fiebre","example":"Do you have a fever?"},{"en":"feel better","es":"sentirse mejor","example":"I hope you feel better."},{"en":"rest","es":"descansar","example":"You should rest for two days."},{"en":"medicine","es":"remedio","example":"Take this medicine after meals."},{"en":"since","es":"desde","example":"I feel sick since Monday."},{"en":"prescription","es":"receta","example":"Here’s your prescription."}],"grammar":{"title":"Consejos con should / shouldn’t","explain":"«Should» sirve para dar consejos. Va seguido del verbo base: You should drink water. You shouldn’t go to work.","examples":[{"en":"You should sleep more.","es":"Deberías dormir más."},{"en":"You shouldn’t drink coffee today.","es":"No deberías tomar café hoy."}],"exercises":[{"prompt":"You ___ rest for a few days.","options":["should","should to","shoulds"],"answer":"should"},{"prompt":"You shouldn’t ___ to the gym with a fever.","options":["go","going","goes"],"answer":"go"},{"prompt":"I have a ___. My head hurts.","options":["sore throat","headache","fever"],"answer":"headache"}]},"dialogue":[{"speaker":"A","en":"Good morning. What’s the problem?","es":"Buen día. ¿Qué le pasa?"},{"speaker":"B","en":"I have a sore throat and a headache since Tuesday.","es":"Tengo dolor de garganta y de cabeza desde el martes."},{"speaker":"A","en":"Do you have a fever?","es":"¿Tiene fiebre?"},{"speaker":"B","en":"A little, last night.","es":"Un poco, anoche."},{"speaker":"A","en":"It looks like a cold. You should rest and drink a lot of water.","es":"Parece un resfrío. Debería descansar y tomar mucha agua."},{"speaker":"B","en":"Should I stay home from work?","es":"¿Me quedo sin ir a trabajar?"},{"speaker":"A","en":"Yes, for two days. You’ll feel better soon.","es":"Sí, dos días. Pronto se va a sentir mejor."}],"questions":[{"q":"Since when does B feel sick?","options":["Since Tuesday","Since last night","Since Sunday"],"answer":0},{"q":"What does the doctor recommend?","options":["Go to the gym","Rest and drink water","Take a trip"],"answer":1}],"speak":[{"en":"I have a sore throat since Tuesday.","es":"Me duele la garganta desde el martes."},{"en":"You should rest and drink a lot of water.","es":"Deberías descansar y tomar mucha agua."},{"en":"I hope you feel better soon.","es":"Espero que te mejores pronto."}]},{"id":"b1-plans","level":"B1","title":"Planes y predicciones","topic":"Future plans","minutes":8,"vocab":[{"en":"plan to","es":"planear","example":"I plan to launch the store in March."},{"en":"goal","es":"objetivo","example":"My goal is to speak more fluently."},{"en":"probably","es":"probablemente","example":"It will probably rain."},{"en":"look forward to","es":"esperar con ganas","example":"I’m looking forward to the trip."},{"en":"deadline","es":"fecha límite","example":"The deadline is next Friday."},{"en":"launch","es":"lanzar","example":"We’re launching a new product."},{"en":"grow","es":"crecer","example":"I want the company to grow."},{"en":"by the end of","es":"para fines de","example":"By the end of the year."}],"grammar":{"title":"Will vs. going to vs. presente continuo","explain":"«Going to» = planes ya decididos. «Will» = decisiones del momento y predicciones. Presente continuo = citas y arreglos con fecha (I’m meeting Ana on Friday).","examples":[{"en":"I’m going to study every morning.","es":"Voy a estudiar todas las mañanas."},{"en":"I think it will be a good year.","es":"Creo que va a ser un buen año."},{"en":"We’re launching on Monday.","es":"Lanzamos el lunes."}],"exercises":[{"prompt":"The phone is ringing. — I ___ get it!","options":["’ll","’m going to","am getting"],"answer":"’ll"},{"prompt":"I’ve decided: I ___ learn to cook this year.","options":["will","am going to","learn"],"answer":"am going to"},{"prompt":"I ___ my accountant tomorrow at 3. (cita)","options":["meet","am meeting","will to meet"],"answer":"am meeting"}]},"dialogue":[{"speaker":"A","en":"So, what are your plans for next year?","es":"¿Y qué planes tenés para el año que viene?"},{"speaker":"B","en":"I’m going to launch an online store for my company.","es":"Voy a lanzar una tienda online para mi empresa."},{"speaker":"A","en":"That’s exciting! When?","es":"¡Qué bueno! ¿Cuándo?"},{"speaker":"B","en":"We’re meeting the designers on Monday, and the deadline is March.","es":"Nos juntamos con los diseñadores el lunes, y la fecha límite es marzo."},{"speaker":"A","en":"Do you think it will be ready?","es":"¿Creés que va a estar listo?"},{"speaker":"B","en":"Probably. I’m really looking forward to it.","es":"Probablemente. Tengo muchas ganas."}],"questions":[{"q":"What is B going to launch?","options":["An app","An online store","A restaurant"],"answer":1},{"q":"When is the meeting with the designers?","options":["In March","On Monday","Next year"],"answer":1}],"speak":[{"en":"I’m going to launch an online store next year.","es":"El año que viene voy a lanzar una tienda online."},{"en":"I’m really looking forward to it.","es":"Tengo muchas ganas."},{"en":"I think it will probably be ready by March.","es":"Creo que probablemente esté listo para marzo."}]},{"id":"b1-opinions","level":"B1","title":"Dar tu opinión","topic":"Giving opinions","minutes":8,"vocab":[{"en":"in my opinion","es":"en mi opinión","example":"In my opinion, remote work is better."},{"en":"I agree","es":"estoy de acuerdo","example":"I agree with you."},{"en":"I’m not sure","es":"no estoy seguro","example":"I’m not sure about that."},{"en":"on the other hand","es":"por otro lado","example":"On the other hand, it’s expensive."},{"en":"advantage","es":"ventaja","example":"The main advantage is time."},{"en":"drawback","es":"desventaja","example":"One drawback is the noise."},{"en":"point","es":"argumento, punto","example":"That’s a good point."},{"en":"depend on","es":"depender de","example":"It depends on the situation."}],"grammar":{"title":"Conectores: although, however, because, so","explain":"«Although» une dos ideas opuestas en una oración; «However» empieza una oración nueva. «Because» da la causa y «so» la consecuencia.","examples":[{"en":"Although it’s cheap, it’s not good.","es":"Aunque es barato, no es bueno."},{"en":"It’s cheap. However, it’s not good.","es":"Es barato. Sin embargo, no es bueno."}],"exercises":[{"prompt":"I stayed home ___ I was tired.","options":["so","because","however"],"answer":"because"},{"prompt":"It was late, ___ we took a taxi.","options":["so","although","because"],"answer":"so"},{"prompt":"___ it was raining, we went out.","options":["However","Although","So"],"answer":"Although"}]},"dialogue":[{"speaker":"A","en":"What do you think about working from home?","es":"¿Qué pensás de trabajar desde casa?"},{"speaker":"B","en":"In my opinion, it has a lot of advantages. I save two hours a day.","es":"Para mí tiene muchas ventajas. Me ahorro dos horas por día."},{"speaker":"A","en":"I agree, but on the other hand, I miss my colleagues.","es":"Coincido, pero por otro lado extraño a mis compañeros."},{"speaker":"B","en":"That’s a good point. Maybe a mix is the best option.","es":"Buen punto. Quizás lo mejor sea una mezcla."},{"speaker":"A","en":"I think it depends on the job.","es":"Creo que depende del trabajo."}],"questions":[{"q":"What advantage does B mention?","options":["Saving time","Meeting people","Earning more"],"answer":0},{"q":"What drawback does A mention?","options":["Noise","Missing colleagues","Bad internet"],"answer":1}],"speak":[{"en":"In my opinion, it has a lot of advantages.","es":"En mi opinión, tiene muchas ventajas."},{"en":"That’s a good point, although I’m not sure.","es":"Buen punto, aunque no estoy seguro."},{"en":"I think it depends on the situation.","es":"Creo que depende de la situación."}]},{"id":"b1-experiences","level":"B1","title":"Experiencias","topic":"Life experiences","minutes":8,"vocab":[{"en":"ever","es":"alguna vez","example":"Have you ever been to Japan?"},{"en":"never","es":"nunca","example":"I’ve never tried sushi."},{"en":"already","es":"ya","example":"I’ve already finished."},{"en":"yet","es":"todavía / ya (preg.)","example":"Have you finished yet?"},{"en":"abroad","es":"en el exterior","example":"I’ve lived abroad."},{"en":"experience","es":"experiencia","example":"It was an amazing experience."},{"en":"so far","es":"hasta ahora","example":"So far, so good."},{"en":"for / since","es":"durante / desde","example":"I’ve known her for ten years."}],"grammar":{"title":"Present perfect (have + participio)","explain":"Hablamos de experiencias sin fecha o de algo que sigue hasta hoy. Con fecha concreta usamos el pasado simple: I’ve been to Chile (sin fecha) / I went to Chile in 2020.","examples":[{"en":"I’ve visited Brazil twice.","es":"Fui a Brasil dos veces."},{"en":"She has worked here since 2019.","es":"Trabaja acá desde 2019."}],"exercises":[{"prompt":"Have you ___ been to Europe?","options":["ever","yet","since"],"answer":"ever"},{"prompt":"I’ve lived here ___ five years.","options":["since","for","ago"],"answer":"for"},{"prompt":"I ___ to Chile in 2020.","options":["have gone","went","have went"],"answer":"went"}]},"dialogue":[{"speaker":"A","en":"Have you ever lived abroad?","es":"¿Alguna vez viviste en el exterior?"},{"speaker":"B","en":"Yes, I lived in Spain for a year in 2018.","es":"Sí, viví un año en España en 2018."},{"speaker":"A","en":"Wow. Have you been back since then?","es":"¡Uau! ¿Volviste desde entonces?"},{"speaker":"B","en":"Not yet, but I’d love to. What about you?","es":"Todavía no, pero me encantaría. ¿Y vos?"},{"speaker":"A","en":"I’ve never lived abroad, but I’ve traveled a lot in South America.","es":"Nunca viví afuera, pero viajé mucho por Sudamérica."}],"questions":[{"q":"How long did B live in Spain?","options":["A year","Two years","Six months"],"answer":0},{"q":"Has A lived abroad?","options":["Yes, in Spain","No, never","Yes, in Brazil"],"answer":1}],"speak":[{"en":"Have you ever lived abroad?","es":"¿Alguna vez viviste en el exterior?"},{"en":"I’ve never been to Japan, but I’d love to go.","es":"Nunca fui a Japón, pero me encantaría."},{"en":"I’ve known my best friend for ten years.","es":"Conozco a mi mejor amigo hace diez años."}]},{"id":"b1-work-meeting","level":"B1","title":"Reuniones de trabajo","topic":"Work meetings","minutes":8,"vocab":[{"en":"agenda","es":"orden del día","example":"Let’s go through the agenda."},{"en":"follow up","es":"hacer seguimiento","example":"I’ll follow up by email."},{"en":"budget","es":"presupuesto","example":"We need to review the budget."},{"en":"suggest","es":"sugerir","example":"I suggest we start with sales."},{"en":"postpone","es":"posponer","example":"Can we postpone the call?"},{"en":"figure out","es":"resolver, descifrar","example":"We need to figure out the price."},{"en":"on track","es":"encaminado","example":"The project is on track."},{"en":"wrap up","es":"cerrar, terminar","example":"Let’s wrap up the meeting."}],"grammar":{"title":"Propuestas: Let’s / How about / Why don’t we","explain":"Para proponer algo con naturalidad: «Let’s + verbo», «How about + -ing» y «Why don’t we + verbo». Suenan colaborativos, no órdenes.","examples":[{"en":"Let’s start with the budget.","es":"Empecemos por el presupuesto."},{"en":"How about meeting on Thursday?","es":"¿Qué tal si nos juntamos el jueves?"}],"exercises":[{"prompt":"How about ___ the call to Friday?","options":["move","moving","to move"],"answer":"moving"},{"prompt":"Why don’t we ___ a short break?","options":["take","taking","took"],"answer":"take"},{"prompt":"___ wrap up for today.","options":["Let’s","How about","Why"],"answer":"Let’s"}]},"dialogue":[{"speaker":"A","en":"OK everyone, let’s go through the agenda.","es":"Bueno, repasemos el orden del día."},{"speaker":"B","en":"First, the online store. Is it on track?","es":"Primero, la tienda online. ¿Viene encaminada?"},{"speaker":"A","en":"Mostly. We still need to figure out the shipping costs.","es":"En general sí. Falta resolver los costos de envío."},{"speaker":"B","en":"How about asking two carriers for a quote?","es":"¿Qué tal si pedimos presupuesto a dos transportistas?"},{"speaker":"A","en":"Good idea. I’ll follow up by email tomorrow.","es":"Buena idea. Mañana hago el seguimiento por mail."},{"speaker":"B","en":"Great. Let’s wrap up here.","es":"Genial. Cerremos acá."}],"questions":[{"q":"What do they still need to figure out?","options":["The design","Shipping costs","The budget"],"answer":1},{"q":"How will A follow up?","options":["By phone","In person","By email"],"answer":2}],"speak":[{"en":"Let’s go through the agenda.","es":"Repasemos el orden del día."},{"en":"We still need to figure out the shipping costs.","es":"Todavía tenemos que resolver los costos de envío."},{"en":"I’ll follow up by email tomorrow.","es":"Mañana hago el seguimiento por mail."}]},{"id":"b2-regrets","level":"B2","title":"Hipótesis y arrepentimientos","topic":"Regrets and hypotheticals","minutes":9,"vocab":[{"en":"wish","es":"desear, ojalá","example":"I wish I had more time."},{"en":"regret","es":"arrepentirse","example":"I don’t regret it."},{"en":"otherwise","es":"si no, de lo contrario","example":"Hurry, otherwise we’ll miss it."},{"en":"take a risk","es":"arriesgarse","example":"Sometimes you have to take a risk."},{"en":"looking back","es":"mirando atrás","example":"Looking back, it was the right choice."},{"en":"turn out","es":"resultar","example":"It turned out well."},{"en":"hindsight","es":"retrospectiva","example":"In hindsight, I should have asked."},{"en":"make up your mind","es":"decidirse","example":"I can’t make up my mind."}],"grammar":{"title":"Condicionales 2 y 3, wish","explain":"Segundo condicional = hipótesis presente (If I had time, I would travel). Tercero = pasado que no pasó (If I had left earlier, I would have caught the train). «I wish + pasado» para deseos presentes.","examples":[{"en":"If I lived closer, I would walk to work.","es":"Si viviera más cerca, iría caminando."},{"en":"If we had planned better, we would have finished.","es":"Si hubiéramos planificado mejor, habríamos terminado."}],"exercises":[{"prompt":"If I ___ more time, I would learn the piano.","options":["have","had","would have"],"answer":"had"},{"prompt":"If she had studied, she ___ passed.","options":["would have","would","had"],"answer":"would have"},{"prompt":"I wish I ___ speak Japanese.","options":["can","could","will"],"answer":"could"}]},"dialogue":[{"speaker":"A","en":"Do you ever regret leaving your old job?","es":"¿Alguna vez te arrepentís de haber dejado tu trabajo anterior?"},{"speaker":"B","en":"Not really. Looking back, it was the right choice.","es":"No mucho. Mirando atrás, fue la decisión correcta."},{"speaker":"A","en":"Would you have started the company if you’d stayed?","es":"¿Habrías arrancado la empresa si te hubieras quedado?"},{"speaker":"B","en":"Probably not. If I hadn’t taken the risk, I wouldn’t be here.","es":"Probablemente no. Si no me hubiera arriesgado, no estaría acá."},{"speaker":"A","en":"I wish I were that brave.","es":"Ojalá yo fuera así de valiente."}],"questions":[{"q":"How does B feel about leaving the old job?","options":["Regrets it","Thinks it was right","Isn’t sure"],"answer":1},{"q":"What would have happened if B had stayed?","options":["B would have a company","B probably wouldn’t have started the company","B would be richer"],"answer":1}],"speak":[{"en":"Looking back, it was the right choice.","es":"Mirando atrás, fue la decisión correcta."},{"en":"If I hadn’t taken the risk, I wouldn’t be here.","es":"Si no me hubiera arriesgado, no estaría acá."},{"en":"I wish I had more free time.","es":"Ojalá tuviera más tiempo libre."}]}];
const ORIGINAL_LEVELS=[{"id":"A1","label":"A1 · Beginner","detail":"Frases básicas y presentaciones"},{"id":"A2","label":"A2 · Elementary","detail":"Situaciones cotidianas y pasado simple"},{"id":"B1","label":"B1 · Intermediate","detail":"Opiniones, planes y experiencias"},{"id":"B2","label":"B2 · Upper-intermediate","detail":"Matices, argumentos y fluidez"}];
const ORIGINAL_QUOTES=[{"text":"No es que tengamos poco tiempo, sino que perdemos mucho.","author":"Séneca","context":"De la brevedad de la vida, carta a Paulino (c. 49 d. C.).","meaning":"La vida alcanza si no la regalamos a lo que no importa. El problema rara vez es la falta de tiempo, sino dónde lo ponemos."},{"text":"No son las cosas las que nos perturban, sino las opiniones que tenemos de ellas.","author":"Epicteto","context":"Enquiridión, capítulo 5. Epicteto fue un esclavo liberto que enseñó filosofía estoica.","meaning":"Entre lo que pasa y cómo nos sentimos hay un juicio. Ese juicio sí depende de nosotros."},{"text":"Primero di qué quieres ser; luego haz lo que tengas que hacer.","author":"Epicteto","context":"Discursos, libro III.","meaning":"Definir la dirección simplifica las decisiones: cada acción se evalúa según si te acerca o no."},{"text":"Si quieres ser escritor, escribe.","author":"Epicteto","context":"Discursos, libro II, sobre cómo se forman los hábitos.","meaning":"Las identidades se construyen con la práctica diaria, no con la intención."},{"text":"La vida no examinada no merece ser vivida.","author":"Sócrates","context":"Según Platón en la Apología, durante el juicio a Sócrates (399 a. C.).","meaning":"Reflexionar sobre lo que hacemos y por qué es parte de vivir bien. Escribir un diario es una forma de examen."},{"text":"Conócete a ti mismo.","author":"Templo de Apolo en Delfos","context":"Inscripción en el pronaos del templo, citada por muchos filósofos griegos.","meaning":"Entender tus límites, deseos y hábitos es el punto de partida de cualquier mejora."},{"text":"Nada en exceso.","author":"Templo de Apolo en Delfos","context":"Otra de las máximas inscritas en Delfos.","meaning":"La moderación sostiene en el tiempo lo que la intensidad solo logra por un rato."},{"text":"Mientras enseñamos, aprendemos.","author":"Séneca","context":"Cartas a Lucilio, carta 7.","meaning":"Explicar algo obliga a ordenarlo; por eso enseñar es una de las mejores formas de comprender."},{"text":"El que tiene un porqué para vivir puede soportar casi cualquier cómo.","author":"Friedrich Nietzsche","context":"Crepúsculo de los ídolos (1889). Viktor Frankl la retomó en El hombre en busca de sentido.","meaning":"Un propósito claro da resistencia frente a las dificultades."},{"text":"Caminante, no hay camino, se hace camino al andar.","author":"Antonio Machado","context":"Campos de Castilla (1912), \"Proverbios y cantares\".","meaning":"El rumbo se descubre avanzando; esperar a tener todo claro puede ser una forma de no empezar."},{"text":"Hoy es siempre todavía.","author":"Antonio Machado","context":"Juan de Mairena (1936).","meaning":"Mientras sea hoy, todavía hay margen para actuar."},{"text":"Somos lo que hacemos repetidamente. La excelencia, entonces, no es un acto sino un hábito.","author":"Will Durant","context":"The Story of Philosophy (1926). Suele atribuirse a Aristóteles, pero es una síntesis de Durant sobre su ética.","meaning":"Los resultados reflejan la suma de pequeñas acciones cotidianas."},{"text":"Hay que cultivar nuestro jardín.","author":"Voltaire","context":"Última línea de Cándido (1759).","meaning":"Frente a lo que no controlamos, ocuparnos con cuidado de lo cercano y concreto."},{"text":"Pienso, luego existo.","author":"René Descartes","context":"Discurso del método (1637).","meaning":"Incluso dudando de todo, el acto de pensar demuestra que hay alguien que piensa."},{"text":"Todo fluye.","author":"Heráclito","context":"Fórmula con la que la tradición resume su pensamiento (c. 500 a. C.).","meaning":"El cambio es la regla, no la excepción; conviene diseñar la vida pensando en eso."},{"text":"Pierde una hora por la mañana y la estarás buscando todo el día.","author":"Richard Whately","context":"Arzobispo y lógico inglés del siglo XIX.","meaning":"Cómo empieza el día marca el ritmo del resto."},{"text":"Vivir es lo más raro del mundo. La mayoría de la gente existe, eso es todo.","author":"Oscar Wilde","context":"El alma del hombre bajo el socialismo (1891).","meaning":"Vivir de verdad implica elegir y prestar atención, no solo dejar pasar los días."},{"text":"Haz cada acto de tu vida como si fuera el último.","author":"Marco Aurelio","context":"Meditaciones, libro II. Notas personales del emperador romano.","meaning":"Hacer cada cosa con presencia y sin prisa ansiosa."},{"text":"Lo esencial es invisible a los ojos.","author":"Antoine de Saint-Exupéry","context":"El principito (1943), dicho por el zorro.","meaning":"Lo que más importa suele no verse a simple vista: vínculos, tiempo dedicado, cuidado."},{"text":"Quien tiene paciencia obtendrá lo que desea.","author":"Benjamin Franklin","context":"Almanaque del pobre Richard (siglo XVIII).","meaning":"Muchos logros dependen más de la constancia que del talento."},{"text":"La felicidad de tu vida depende de la calidad de tus pensamientos.","author":"Marco Aurelio","context":"Meditaciones, libro V.","meaning":"Lo que te repetís por dentro tiñe cómo vivís lo que pasa afuera."},{"text":"Tienes poder sobre tu mente, no sobre los acontecimientos. Date cuenta de esto y encontrarás la fuerza.","author":"Marco Aurelio","context":"Meditaciones. Escritas durante campañas militares, sin intención de publicarse.","meaning":"Poner la energía donde sí hay control devuelve calma y eficacia."},{"text":"Lo que no es bueno para la colmena no es bueno para la abeja.","author":"Marco Aurelio","context":"Meditaciones, libro VI.","meaning":"El bien propio y el común están más unidos de lo que parece."},{"text":"La mejor venganza es no parecerse a quien te hizo daño.","author":"Marco Aurelio","context":"Meditaciones, libro VI.","meaning":"Responder al mal sin copiarlo es la forma más alta de no dejarse vencer."},{"text":"Pronto habrás olvidado todo; pronto todos te habrán olvidado.","author":"Marco Aurelio","context":"Meditaciones, libro VII.","meaning":"Recordar la fugacidad baja el peso de la opinión ajena y del ego."},{"text":"Sufrimos más a menudo en la imaginación que en la realidad.","author":"Séneca","context":"Cartas a Lucilio, carta 13.","meaning":"Gran parte del miedo es anticipación: lo temido casi nunca llega tal como lo imaginamos."},{"text":"La suerte es lo que sucede cuando la preparación se encuentra con la oportunidad.","author":"Séneca","context":"Idea atribuida a Séneca; la formulación moderna es una paráfrasis.","meaning":"Prepararse multiplica las chances de aprovechar lo inesperado."},{"text":"Ningún viento es favorable para quien no sabe a qué puerto se dirige.","author":"Séneca","context":"Cartas a Lucilio, carta 71.","meaning":"Sin un rumbo, cualquier ayuda o impulso se desperdicia."},{"text":"Apresúrate a vivir bien y piensa que cada día es por sí solo una vida.","author":"Séneca","context":"Cartas a Lucilio, carta 101.","meaning":"No postergar la vida buena para un futuro que no está garantizado."},{"text":"No es pobre el que tiene poco, sino el que mucho desea.","author":"Séneca","context":"Cartas a Lucilio, carta 2.","meaning":"La riqueza también se mide por cuánto necesitás para estar en paz."},{"text":"Es imposible que un hombre aprenda lo que cree que ya sabe.","author":"Epicteto","context":"Discursos, libro II.","meaning":"La humildad es la condición para aprender."},{"text":"Ningún gran logro se consigue de repente.","author":"Epicteto","context":"Discursos, libro I: «ni siquiera un racimo de uvas o un higo».","meaning":"Lo valioso madura con tiempo y proceso."},{"text":"La riqueza no consiste en tener grandes posesiones, sino en tener pocas necesidades.","author":"Epicteto","context":"Fragmento transmitido por Estobeo.","meaning":"Reducir lo que necesitás es otra forma de volverte rico."},{"text":"Solo sé que no sé nada.","author":"Sócrates","context":"Fórmula tradicional que resume la Apología de Platón.","meaning":"Reconocer la propia ignorancia es el inicio del conocimiento."},{"text":"Somos lo que hacemos día a día; de modo que la excelencia no es un acto, sino un hábito.","author":"Aristóteles","context":"Versión popular de la Ética a Nicómaco, libro II.","meaning":"El carácter se forma con la repetición de pequeñas acciones."},{"text":"Una golondrina no hace verano, ni un solo día.","author":"Aristóteles","context":"Ética a Nicómaco, libro I.","meaning":"La vida buena se juzga por su conjunto, no por un momento aislado."},{"text":"Es la marca de una mente educada ser capaz de considerar un pensamiento sin aceptarlo.","author":"Aristóteles","context":"Paráfrasis moderna de la Ética a Nicómaco.","meaning":"Pensar bien incluye poder escuchar ideas sin adoptarlas."},{"text":"Nadie se baña dos veces en el mismo río.","author":"Heráclito","context":"Fragmento transmitido por Platón en el Crátilo.","meaning":"Ni el río ni nosotros somos los mismos: todo cambia."},{"text":"El carácter de un hombre es su destino.","author":"Heráclito","context":"Fragmento 119 (Diels-Kranz).","meaning":"Cómo somos va trazando lo que nos pasa."},{"text":"No es rico el que tiene mucho, sino el que da mucho.","author":"Epicuro","context":"Pensamiento transmitido en sus máximas.","meaning":"La generosidad es una forma de abundancia."},{"text":"De todos los bienes que la sabiduría procura para la felicidad de la vida entera, el más grande es la amistad.","author":"Epicuro","context":"Máximas capitales, XXVII.","meaning":"Los vínculos son el tesoro más firme."},{"text":"La paciencia es amarga, pero su fruto es dulce.","author":"Jean-Jacques Rousseau","context":"Frase atribuida en su pensamiento pedagógico (siglo XVIII).","meaning":"Esperar cuesta, pero lo que madura con tiempo vale más."},{"text":"Atrévete a saber.","author":"Immanuel Kant","context":"¿Qué es la Ilustración? (1784), retomando el «Sapere aude» de Horacio.","meaning":"Pensar por uno mismo requiere valentía."},{"text":"Dos cosas llenan el ánimo de admiración: el cielo estrellado sobre mí y la ley moral dentro de mí.","author":"Immanuel Kant","context":"Crítica de la razón práctica (1788), conclusión.","meaning":"Asombrarse por el universo y por la conciencia propia."},{"text":"El corazón tiene razones que la razón ignora.","author":"Blaise Pascal","context":"Pensamientos (1670).","meaning":"No todo lo importante se explica con lógica."},{"text":"Toda la desgracia de los hombres viene de no saber quedarse tranquilos en una habitación.","author":"Blaise Pascal","context":"Pensamientos (1670), sobre la distracción.","meaning":"Huir del silencio y de uno mismo trae muchos problemas."},{"text":"Lo que no me mata me hace más fuerte.","author":"Friedrich Nietzsche","context":"Crepúsculo de los ídolos (1889).","meaning":"Las dificultades atravesadas pueden volverse recursos."},{"text":"Sin música, la vida sería un error.","author":"Friedrich Nietzsche","context":"Crepúsculo de los ídolos (1889).","meaning":"El arte no es un lujo: da sentido a la existencia."},{"text":"Llega a ser el que eres.","author":"Friedrich Nietzsche","context":"Subtítulo de Ecce homo, tomado de Píndaro.","meaning":"La vida es un proceso de volverse uno mismo."},{"text":"El hombre está condenado a ser libre.","author":"Jean-Paul Sartre","context":"El existencialismo es un humanismo (1946).","meaning":"No podemos evitar elegir; incluso no elegir es una elección."},{"text":"En medio del invierno aprendí por fin que había en mí un verano invencible.","author":"Albert Camus","context":"Regreso a Tipasa (1952).","meaning":"Aun en las épocas oscuras hay en nosotros algo que resiste."},{"text":"Hay que imaginarse a Sísifo feliz.","author":"Albert Camus","context":"El mito de Sísifo (1942), última línea.","meaning":"El sentido puede encontrarse en el propio esfuerzo, no solo en la meta."},{"text":"Los límites de mi lenguaje significan los límites de mi mundo.","author":"Ludwig Wittgenstein","context":"Tractatus logico-philosophicus (1921), 5.6.","meaning":"Ampliar las palabras amplía lo que podemos pensar."},{"text":"Yo soy yo y mi circunstancia, y si no la salvo a ella no me salvo yo.","author":"José Ortega y Gasset","context":"Meditaciones del Quijote (1914).","meaning":"Somos inseparables de nuestro contexto; cuidarlo es cuidarnos."},{"text":"La vida solo puede ser comprendida mirando hacia atrás, pero ha de ser vivida mirando hacia adelante.","author":"Søren Kierkegaard","context":"Diarios (1843).","meaning":"El sentido aparece después; igual hay que avanzar."},{"text":"Al hombre se le puede arrebatar todo salvo una cosa: la última de las libertades humanas, la elección de la actitud.","author":"Viktor Frankl","context":"El hombre en busca de sentido (1946), tras sobrevivir a los campos de concentración.","meaning":"Aun sin control de las circunstancias, conservamos la respuesta."},{"text":"Entre el estímulo y la respuesta hay un espacio.","author":"Viktor Frankl","context":"Idea asociada a su obra, popularizada por Stephen Covey.","meaning":"En ese espacio está la libertad de elegir cómo responder."},{"text":"Un viaje de mil millas comienza con un solo paso.","author":"Lao-Tsé","context":"Tao Te Ching, capítulo 64.","meaning":"Lo enorme empieza siendo pequeño."},{"text":"Quien conoce a los demás es sabio; quien se conoce a sí mismo es iluminado.","author":"Lao-Tsé","context":"Tao Te Ching, capítulo 33.","meaning":"El conocimiento más difícil es el de uno mismo."},{"text":"La naturaleza no se apresura, y sin embargo todo se cumple.","author":"Lao-Tsé","context":"Idea del Tao Te Ching en versión popular.","meaning":"El ritmo sostenido logra más que la urgencia."},{"text":"No importa lo despacio que vayas mientras no te detengas.","author":"Confucio","context":"Dicho atribuido en la tradición de las Analectas.","meaning":"La constancia vale más que la velocidad."},{"text":"Elige un trabajo que ames y no tendrás que trabajar ni un día de tu vida.","author":"Confucio","context":"Atribución popular; no aparece literalmente en las Analectas.","meaning":"Cuando el trabajo tiene sentido, el esfuerzo pesa menos."},{"text":"Aprender sin pensar es inútil; pensar sin aprender es peligroso.","author":"Confucio","context":"Analectas, libro II.","meaning":"Estudio y reflexión se necesitan mutuamente."},{"text":"El que domina a los demás es fuerte; el que se domina a sí mismo es poderoso.","author":"Lao-Tsé","context":"Tao Te Ching, capítulo 33.","meaning":"El verdadero poder es el autodominio."},{"text":"La mente lo es todo. Te conviertes en lo que piensas.","author":"Buda","context":"Paráfrasis popular del Dhammapada, verso 1.","meaning":"Los pensamientos repetidos moldean quiénes somos."},{"text":"Aferrarse al enojo es como agarrar un carbón caliente para tirárselo a otro: el que se quema eres tú.","author":"Buda","context":"Paráfrasis moderna de la enseñanza de Buddhaghosa.","meaning":"El rencor daña primero a quien lo sostiene."},{"text":"Cae siete veces, levántate ocho.","author":"Proverbio japonés","context":"Nana korobi ya oki.","meaning":"La resiliencia es levantarse una vez más de las que caemos."},{"text":"Si tienes un problema que tiene solución, ¿para qué te preocupas? Y si no la tiene, ¿para qué te preocupas?","author":"Proverbio chino","context":"Atribuido también a Shantideva.","meaning":"La preocupación no ayuda en ningún caso: actuar o aceptar."},{"text":"En la mente del principiante hay muchas posibilidades; en la del experto, pocas.","author":"Shunryu Suzuki","context":"Mente zen, mente de principiante (1970).","meaning":"Mirar con ojos nuevos abre caminos que la experiencia cierra."},{"text":"Siempre imaginé que el Paraíso sería algún tipo de biblioteca.","author":"Jorge Luis Borges","context":"Poema de los dones (1960).","meaning":"La lectura como lugar de plenitud."},{"text":"He cometido el peor de los pecados que un hombre puede cometer. No he sido feliz.","author":"Jorge Luis Borges","context":"El remordimiento, en La moneda de hierro (1976).","meaning":"La felicidad también es una responsabilidad."},{"text":"Uno no es lo que es por lo que escribe, sino por lo que ha leído.","author":"Jorge Luis Borges","context":"Frase de entrevistas; Borges se consideraba ante todo un lector.","meaning":"Lo que leemos nos forma."},{"text":"Andábamos sin buscarnos, pero sabiendo que andábamos para encontrarnos.","author":"Julio Cortázar","context":"Rayuela (1963), capítulo 1.","meaning":"Algunos encuentros parecen casuales y a la vez inevitables."},{"text":"Nada está perdido si se tiene el valor de proclamar que todo está perdido y hay que empezar de nuevo.","author":"Julio Cortázar","context":"Rayuela (1963).","meaning":"Aceptar el fracaso puede ser el primer paso para recomenzar."},{"text":"La vida no es la que uno vivió, sino la que uno recuerda y cómo la recuerda para contarla.","author":"Gabriel García Márquez","context":"Epígrafe de Vivir para contarla (2002).","meaning":"La memoria y el relato dan forma a nuestra historia."},{"text":"No hay medicina que cure lo que no cura la felicidad.","author":"Gabriel García Márquez","context":"Memoria de mis putas tristes (2004).","meaning":"La alegría también sana."},{"text":"El secreto de una buena vejez no es otra cosa que un pacto honrado con la soledad.","author":"Gabriel García Márquez","context":"Cien años de soledad (1967).","meaning":"Hacer las paces con estar solo trae serenidad."},{"text":"Caminante, son tus huellas el camino y nada más.","author":"Antonio Machado","context":"Campos de Castilla (1912), Proverbios y cantares XXIX.","meaning":"El camino no existe antes de recorrerlo."},{"text":"Todo pasa y todo queda, pero lo nuestro es pasar.","author":"Antonio Machado","context":"Campos de Castilla (1912).","meaning":"Somos transitorios; lo importante es cómo pasamos."},{"text":"Puedo escribir los versos más tristes esta noche.","author":"Pablo Neruda","context":"Poema 20, Veinte poemas de amor y una canción desesperada (1924).","meaning":"Escribir el dolor es una forma de atravesarlo."},{"text":"Es tan corto el amor, y es tan largo el olvido.","author":"Pablo Neruda","context":"Poema 20 (1924).","meaning":"Lo intenso dura poco y su huella, mucho."},{"text":"Podrán cortar todas las flores, pero no podrán detener la primavera.","author":"Pablo Neruda","context":"Frase atribuida; circula ligada a su obra política.","meaning":"Lo que nace con fuerza no se detiene por la fuerza."},{"text":"La vida es sueño, y los sueños, sueños son.","author":"Pedro Calderón de la Barca","context":"La vida es sueño (1635), soliloquio de Segismundo.","meaning":"Relativizar lo que creemos real nos vuelve más humildes."},{"text":"El que lee mucho y anda mucho, ve mucho y sabe mucho.","author":"Miguel de Cervantes","context":"Don Quijote de la Mancha, segunda parte (1615), cap. XXV.","meaning":"Leer y viajar ensanchan el mundo."},{"text":"La libertad, Sancho, es uno de los más preciosos dones que a los hombres dieron los cielos.","author":"Miguel de Cervantes","context":"Don Quijote, segunda parte, cap. LVIII.","meaning":"Pocas cosas valen tanto como ser libres."},{"text":"Cada uno es artífice de su ventura.","author":"Miguel de Cervantes","context":"Don Quijote, segunda parte, cap. LXVI.","meaning":"Nuestra suerte depende en buena parte de nosotros."},{"text":"Hay golpes en la vida, tan fuertes… ¡Yo no sé!","author":"César Vallejo","context":"Los heraldos negros (1918).","meaning":"Algunos dolores no tienen explicación, solo expresión."},{"text":"Todo lo que se come sin necesidad se roba al estómago de los pobres.","author":"José Martí","context":"Pensamiento de sus escritos periodísticos.","meaning":"El exceso propio tiene un costo para otros."},{"text":"Ser culto es el único modo de ser libre.","author":"José Martí","context":"Maestros ambulantes (1884).","meaning":"La educación es la base de la libertad."},{"text":"Educar es depositar en cada hombre toda la obra humana que le ha antecedido.","author":"José Martí","context":"Escritos sobre educación.","meaning":"Aprender es heredar lo que otros construyeron."},{"text":"Es mejor morir de pie que vivir de rodillas.","author":"Emiliano Zapata","context":"Frase atribuida; también usada por Dolores Ibárruri.","meaning":"La dignidad vale más que la comodidad."},{"text":"Hay que endurecerse, pero sin perder la ternura jamás.","author":"Ernesto Guevara","context":"Frase atribuida, difundida en los años sesenta.","meaning":"La firmeza no tiene por qué borrar la sensibilidad."},{"text":"Las palabras son como las monedas: una vale por muchas, como muchas no valen por una.","author":"Francisco de Quevedo","context":"Pensamiento de su obra moral (siglo XVII).","meaning":"Una palabra justa vale más que un discurso vacío."},{"text":"Lo bueno, si breve, dos veces bueno.","author":"Baltasar Gracián","context":"Oráculo manual y arte de prudencia (1647), aforismo 105.","meaning":"La brevedad es una forma de respeto."},{"text":"Saber y saberlo demostrar es valer dos veces.","author":"Baltasar Gracián","context":"Oráculo manual y arte de prudencia (1647).","meaning":"El conocimiento vale más cuando se comparte bien."},{"text":"Soy de los que creen que la vida es un poco más amplia que los sueños.","author":"Mario Benedetti","context":"Pensamiento difundido de su obra.","meaning":"La realidad puede sorprender más que lo imaginado."},{"text":"No te rindas, aún estás a tiempo de alcanzar y comenzar de nuevo.","author":"Mario Benedetti","context":"Atribuido a Benedetti; el poema circula con autoría discutida.","meaning":"Siempre queda margen para volver a empezar."},{"text":"Lo peor no es cometer un error, sino tratar de justificarlo, en vez de aprovecharlo como aviso providencial de nuestra ligereza o ignorancia.","author":"Santiago Ramón y Cajal","context":"Reglas y consejos sobre investigación científica (1897).","meaning":"El error bien leído enseña; justificarlo lo desperdicia."},{"text":"Todo hombre puede ser, si se lo propone, escultor de su propio cerebro.","author":"Santiago Ramón y Cajal","context":"Reglas y consejos sobre investigación científica (1897).","meaning":"La práctica cambia literalmente lo que somos capaces de hacer."},{"text":"Ser o no ser, esa es la cuestión.","author":"William Shakespeare","context":"Hamlet (c. 1600), acto III, escena 1.","meaning":"Las grandes preguntas sobre la existencia no se esquivan."},{"text":"Somos de la misma materia de la que están hechos los sueños.","author":"William Shakespeare","context":"La tempestad (1611), acto IV.","meaning":"La vida tiene algo de efímero y de maravilloso."},{"text":"Sé fiel a ti mismo.","author":"William Shakespeare","context":"Hamlet, acto I, escena 3: consejo de Polonio a Laertes.","meaning":"La coherencia con uno mismo sostiene el resto."},{"text":"Todas las familias felices se parecen; cada familia desdichada lo es a su manera.","author":"León Tolstói","context":"Primera línea de Ana Karenina (1877).","meaning":"El sufrimiento tiene formas únicas; la armonía, rasgos comunes."},{"text":"Todos piensan en cambiar el mundo, pero nadie piensa en cambiarse a sí mismo.","author":"León Tolstói","context":"Tres métodos de reforma (1900), paráfrasis.","meaning":"El cambio empieza por uno."},{"text":"La belleza salvará al mundo.","author":"Fiódor Dostoievski","context":"El idiota (1869), dicho sobre el príncipe Myshkin.","meaning":"La belleza tiene una fuerza que redime."},{"text":"Lo más importante es no mentirse a uno mismo.","author":"Fiódor Dostoievski","context":"Los hermanos Karamázov (1880), consejo del stárets Zósima.","meaning":"La honestidad empieza hacia adentro."},{"text":"Un libro debe ser el hacha que rompa el mar helado dentro de nosotros.","author":"Franz Kafka","context":"Carta a Oskar Pollak (1904).","meaning":"La buena lectura nos sacude y nos transforma."},{"text":"No es que sea tan inteligente, es que me quedo más tiempo con los problemas.","author":"Albert Einstein","context":"Frase atribuida, sin fuente documental clara.","meaning":"La perseverancia supera muchas veces al talento."},{"text":"La imaginación es más importante que el conocimiento.","author":"Albert Einstein","context":"Entrevista en The Saturday Evening Post (1929).","meaning":"Imaginar abre lo que el saber todavía no alcanza."},{"text":"La vida es como andar en bicicleta: para mantener el equilibrio hay que seguir moviéndose.","author":"Albert Einstein","context":"Carta a su hijo Eduard (1930).","meaning":"El movimiento constante da estabilidad."},{"text":"Sé el cambio que quieres ver en el mundo.","author":"Mahatma Gandhi","context":"Paráfrasis popular de sus escritos (1913).","meaning":"Empezar por la propia conducta."},{"text":"Vive como si fueras a morir mañana; aprende como si fueras a vivir siempre.","author":"Mahatma Gandhi","context":"Frase atribuida de sus enseñanzas.","meaning":"Urgencia para vivir, paciencia para aprender."},{"text":"Parece imposible hasta que se hace.","author":"Nelson Mandela","context":"Frase atribuida, muy asociada a su figura.","meaning":"Lo imposible suele ser lo todavía no intentado."},{"text":"La educación es el arma más poderosa que puedes usar para cambiar el mundo.","author":"Nelson Mandela","context":"Discurso en Johannesburgo (2003).","meaning":"Aprender transforma personas y sociedades."},{"text":"No es la especie más fuerte la que sobrevive, sino la que mejor se adapta al cambio.","author":"Leon C. Megginson","context":"Paráfrasis de Darwin hecha por Megginson en 1963; suele atribuirse a Darwin.","meaning":"Adaptarse importa más que resistir."},{"text":"El éxito es ir de fracaso en fracaso sin perder el entusiasmo.","author":"Winston Churchill","context":"Atribución popular; su origen exacto es incierto.","meaning":"El entusiasmo sostiene el intento siguiente."},{"text":"Nada en la vida debe ser temido, solo comprendido.","author":"Marie Curie","context":"Frase atribuida, difundida en biografías.","meaning":"Entender disuelve buena parte del miedo."},{"text":"La simplicidad es la máxima sofisticación.","author":"Leonardo da Vinci","context":"Atribución popular.","meaning":"Llegar a lo simple requiere mucho trabajo."},{"text":"El aprendizaje nunca agota la mente.","author":"Leonardo da Vinci","context":"Pensamiento de sus cuadernos (atribución).","meaning":"Aprender da energía en lugar de gastarla."},{"text":"Quien mira hacia afuera, sueña; quien mira hacia adentro, despierta.","author":"Carl Jung","context":"Carta a Fanny Bowditch (1916).","meaning":"Conocerse es despertar."},{"text":"Aquello a lo que te resistes, persiste.","author":"Carl Jung","context":"Paráfrasis popular de su pensamiento.","meaning":"Lo que evitamos mirar vuelve una y otra vez."},{"text":"Uno no se da cuenta de lo que ha hecho, solo ve lo que queda por hacer.","author":"Marie Curie","context":"Carta a su hermano (1894).","meaning":"Conviene mirar también lo recorrido."},{"text":"Escribo para saber lo que pienso.","author":"Joan Didion","context":"Why I Write (1976), retomando una idea de otros escritores.","meaning":"Escribir ordena y revela el pensamiento."},{"text":"Cómo pasamos nuestros días es, por supuesto, cómo pasamos nuestras vidas.","author":"Annie Dillard","context":"The Writing Life (1989).","meaning":"La vida es la suma de los días comunes."},{"text":"Dime, ¿qué planeas hacer con tu única, salvaje y preciosa vida?","author":"Mary Oliver","context":"The Summer Day (1990).","meaning":"La vida es una sola: vale preguntarse qué hacer con ella."},{"text":"La atención es la forma más rara y pura de la generosidad.","author":"Simone Weil","context":"Carta a Joë Bousquet (1942).","meaning":"Prestar atención de verdad es un regalo."},{"text":"Uno no nace mujer: llega a serlo.","author":"Simone de Beauvoir","context":"El segundo sexo (1949).","meaning":"Muchos roles se aprenden, no vienen dados."},{"text":"No podemos elegir nuestras circunstancias externas, pero siempre podemos elegir cómo respondemos a ellas.","author":"Epicteto","context":"Paráfrasis moderna del Enquiridión.","meaning":"La respuesta es lo que nos pertenece."},{"text":"Las personas olvidarán lo que dijiste, olvidarán lo que hiciste, pero nunca olvidarán cómo las hiciste sentir.","author":"Maya Angelou","context":"Frase atribuida, con antecedentes en Carl Buehner (1971).","meaning":"Lo que queda de un vínculo es cómo se sintió."},{"text":"No hay mayor agonía que llevar dentro una historia no contada.","author":"Maya Angelou","context":"Yo sé por qué canta el pájaro enjaulado (1969).","meaning":"Contar lo propio libera."},{"text":"Leer es soñar de la mano de otro.","author":"Fernando Pessoa","context":"Libro del desasosiego (póstumo, 1982).","meaning":"La lectura es un sueño compartido."},{"text":"El poeta es un fingidor. Finge tan completamente que hasta finge que es dolor el dolor que de veras siente.","author":"Fernando Pessoa","context":"Autopsicografía (1932).","meaning":"El arte transforma la emoción real en otra cosa."},{"text":"Lo que llamamos el principio es a menudo el final. Y hacer un final es hacer un principio.","author":"T. S. Eliot","context":"Little Gidding, Cuatro cuartetos (1942).","meaning":"Cada cierre abre algo nuevo."},{"text":"La paciencia es el arte de esperar.","author":"Proverbio","context":"Refrán de uso común en español.","meaning":"Saber esperar también es hacer."},{"text":"Quien madruga, Dios lo ayuda.","author":"Refrán español","context":"Refranero popular.","meaning":"Empezar temprano da ventaja."},{"text":"Poco a poco se va lejos.","author":"Refrán español","context":"Refranero popular.","meaning":"La constancia lleva lejos."},{"text":"No por mucho madrugar amanece más temprano.","author":"Refrán español","context":"Refranero popular.","meaning":"Hay procesos que no se pueden apurar."},{"text":"La mejor manera de predecir el futuro es inventarlo.","author":"Alan Kay","context":"Reunión en Xerox PARC (1971).","meaning":"El futuro se construye, no solo se espera."},{"text":"Si he visto más lejos es porque estoy sentado sobre hombros de gigantes.","author":"Isaac Newton","context":"Carta a Robert Hooke (1676).","meaning":"Todo logro se apoya en el trabajo de otros."},{"text":"La creatividad es la inteligencia divirtiéndose.","author":"Albert Einstein","context":"Atribución popular.","meaning":"Jugar también es una forma de pensar."},{"text":"La inspiración existe, pero tiene que encontrarte trabajando.","author":"Pablo Picasso","context":"Frase atribuida en entrevistas.","meaning":"La constancia prepara el terreno para las buenas ideas."},{"text":"Todo niño es un artista. El problema es cómo seguir siéndolo al crecer.","author":"Pablo Picasso","context":"Frase atribuida.","meaning":"Conservar la curiosidad es un desafío adulto."},{"text":"El secreto de avanzar es empezar.","author":"Mark Twain","context":"Atribución popular.","meaning":"Arrancar destraba lo demás."},{"text":"Dentro de veinte años estarás más decepcionado por las cosas que no hiciste que por las que hiciste.","author":"H. Jackson Brown Jr.","context":"P.S. I Love You (1990); suele atribuirse a Mark Twain.","meaning":"Arrepiente más lo no intentado."},{"text":"Lo que se mide, mejora.","author":"Peter Drucker","context":"Idea asociada a su obra de gestión.","meaning":"Registrar algo lo vuelve visible y mejorable."},{"text":"No hay nada tan inútil como hacer eficientemente lo que no debería hacerse.","author":"Peter Drucker","context":"Managing for Results (1964), idea central.","meaning":"Primero elegir qué hacer, después cómo."},{"text":"Hecho es mejor que perfecto.","author":"Cultura de Facebook","context":"Lema que colgaba en carteles de las oficinas de la empresa.","meaning":"Terminar da más que perfeccionar sin fin."},{"text":"La perfección no se alcanza cuando no hay nada más que añadir, sino cuando no hay nada más que quitar.","author":"Antoine de Saint-Exupéry","context":"Tierra de hombres (1939).","meaning":"Simplificar es refinar."},{"text":"Solo se ve bien con el corazón.","author":"Antoine de Saint-Exupéry","context":"El principito (1943), capítulo XXI.","meaning":"La mirada afectiva descubre lo esencial."},{"text":"Eres responsable para siempre de lo que has domesticado.","author":"Antoine de Saint-Exupéry","context":"El principito (1943), capítulo XXI.","meaning":"Los vínculos crean responsabilidad."},{"text":"Si quieres construir un barco, no empieces por buscar madera, sino por despertar en los hombres el anhelo del mar.","author":"Antoine de Saint-Exupéry","context":"Atribución popular, inspirada en Ciudadela (1948).","meaning":"El deseo mueve más que las instrucciones."}];

const JOURNAL_COLLECTIONS=[['books','Libros','book','Lecturas y PDFs'],['movies','Películas','film','Por ver y diario de cine'],['music','Música','music','Canciones, álbumes y listas'],['quotes','Frases','quote','Autores e ideas para volver'],['art','Obras de arte','art','Tu galería y obra del día'],['english','Aprender inglés','english','Lecciones, escucha y práctica']];
const mediaFilters={books:'all',movies:'all',music:'all'};let mediaFilter='all',quoteFilter='all',quoteAuthor='',quoteSearch='',catalogResults=[],catalogType='books',catalogRequest=0,artBusy=false;
Object.assign(schemas,{quotes:{singular:'frase',plural:'Frases',icon:'quote',fields:[['text','Frase','textarea'],['author','Autor'],['context','Fuente o contexto','textarea'],['meaning','Qué significa para vos','textarea']],validate:v=>{if(!String(v.text||'').trim())throw Error('Escribí una frase.');}},artworks:{singular:'obra de arte',plural:'Obras de arte',icon:'art',fields:[['name','Título','text',{required:true}],['author','Artista'],['year','Año o período'],['museum','Museo o colección'],['technique','Técnica'],['image','Enlace de la imagen','url'],['url','Ficha de la obra','url'],['notes','Historia y notas','textarea']],validate:v=>{if(!v.name)throw Error('Ingresá un título.');if(v.image&&!safeURL(v.image)||v.url&&!safeURL(v.url))throw Error('Usá enlaces http:// o https:// válidos.');}}});
const libraryValidateBeforeCollections=schemas.library.validate;schemas.library.validate=function(v){libraryValidateBeforeCollections(v);for(const k of ['cover','previewUrl'])if(v[k]&&!safeURL(v[k]))throw Error('Hay enlaces multimedia inválidos.');if(v.rating!==undefined&&(!Number.isFinite(v.rating)||v.rating<0||v.rating>5))throw Error('El puntaje debe estar entre 0 y 5.');for(const k of ['pages','currentPage'])if(v[k]!==undefined&&(!Number.isFinite(v[k])||v[k]<0||v[k]>100000))throw Error('Revisá la cantidad de páginas.');if(v.pages&&v.currentPage>v.pages)throw Error('La página actual supera el total.');};

// Only confirmed films enter the catalogue. Mentioning a film is not enough.
const filmClassCache=new Map(),FILM_CLASSES=new Set(['Q11424','Q24869','Q202866','Q506240','Q93204']);
function wikiClaimIds(entity,property){return (entity?.claims?.[property]||[]).map(c=>c.mainsnak?.datavalue?.value?.id).filter(Boolean)}
async function wikiEntities(ids){if(!ids.length)return {};const out={};for(let i=0;i<ids.length;i+=45){const data=await catalogJSON('https://www.wikidata.org/w/api.php?'+new URLSearchParams({action:'wbgetentities',ids:ids.slice(i,i+45).join('|'),props:'claims',format:'json',origin:'*'}));Object.assign(out,data.entities||{})}return out}
async function confirmedFilmPages(pages){
  const candidates=pages.filter(p=>!p.pageprops?.disambiguation&&!/\b(anexo|categoría|filmografía|banda sonora|franquicia|videojuego|novela|serie de televisión)\b/i.test(p.title));
  if(!candidates.length)return [];
  const entities=await wikiEntities([...new Set(candidates.map(p=>p.pageprops?.wikibase_item).filter(Boolean))]);
  let frontier=[...new Set(Object.values(entities).flatMap(e=>wikiClaimIds(e,'P31')))];
  for(let level=0;level<4&&frontier.length;level++){
    const fresh=frontier.filter(id=>!FILM_CLASSES.has(id)&&!filmClassCache.has(id));
    const classes=await wikiEntities(fresh);for(const id of fresh)filmClassCache.set(id,wikiClaimIds(classes[id],'P279'));
    frontier=[...new Set(frontier.flatMap(id=>filmClassCache.get(id)||[]))];

function filmWikiURL(args){return 'https://es.wikipedia.org/w/api.php?'+new URLSearchParams({action:'query',prop:'pageimages|extracts|pageprops',piprop:'thumbnail',pilicense:'any',pithumbsize:'400',exintro:'1',explaintext:'1',exsentences:'2',exlimit:'max',format:'json',origin:'*',...args})}

// The visible editor uses es-AR; the original named field keeps a canonical
// numeric value so existing forms and accounting never parse grouped strings.
function groupedNumberText(raw){
  const text=String(raw??'');
  if(!text)return '';
  const match=text.match(/^(-?)(\d*)(?:\.(\d*))?$/);
  if(!match)return text;
  const whole=(match[2]||'0').replace(/^0+(?=\d)/,'');
  return match[1]+whole.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(match[3]!==undefined?','+match[3]:'');

function canonicalNumberText(text){
  text=String(text??'').trim().replace(/[\s\u00a0\u202f]/g,'');
  if(!text)return '';

  if(!/^-?[\d.]*,?\d*$/.test(text)||text==='-'||text==='.'||text===',')return null;
